<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สั่งอาหาร - จัดการโต๊ะ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .bill-item { border-bottom: 1px dashed #e0e0e0; padding-bottom: 8px; margin-bottom: 8px; font-size: 14px; }
        .bill-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .card { border-radius: 10px; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="container py-3">

    <!-- Header -->
    <div class="row align-items-center mb-3 pb-2 border-bottom g-2">
        <div class="col-4">
            <a href="dashboard.html" class="btn btn-outline-secondary btn-sm fw-bold">◀ กลับ</a>
        </div>
        <div class="col-4 text-center">
            <h5 class="fw-bold m-0 text-primary text-truncate" id="tableTitle">โต๊ะ: กำลังโหลด...</h5>
        </div>
        <div class="col-4 text-end">
            <span id="shiftStatus" class="badge bg-secondary">กำลังกะ...</span>
        </div>
    </div>

    <div class="row g-3">
        <!-- ฝั่งซ้าย: เครื่องมือ -->
        <div class="col-lg-7">
            
            <!-- โซน 1: เปิดโต๊ะใหม่ -->
            <div id="sectionOpenTable" class="card p-4 mb-3" style="display: none; border-top: 4px solid #198754;">
                <h5 class="fw-bold mb-3 text-success">🛎️ เปิดโต๊ะใหม่</h5>
                <div class="row g-3">
                    <div class="col-6">
                        <label class="form-label small fw-bold">ผู้ใหญ่ (ราคาเต็ม):</label>
                        <input type="number" id="pplAdult" class="form-control text-center" value="1" min="0">
                    </div>
                    <div class="col-6">
                        <label class="form-label small fw-bold">เด็ก (ครึ่งราคา):</label>
                        <input type="number" id="pplChild" class="form-control text-center" value="0" min="0">
                    </div>
                    <div class="col-12">
                        <label class="form-label small fw-bold">เลือกแพ็กเกจ:</label>
                        <select id="pkg" class="form-select"></select>
                    </div>
                    <div class="col-12 mt-3">
                        <button class="btn btn-success w-100 fw-bold shadow-sm" onclick="openNewTable()">✅ เปิดโต๊ะ</button>
                    </div>
                </div>
            </div>

            <!-- โซน 2: จัดการโต๊ะที่เปิดแล้ว -->
            <div id="sectionManageTable" style="display: none;">
                
                <!-- สั่งเตา/ซุป -->
                <div class="card p-3 mb-3" style="border-left: 4px solid #ffc107;">
                    <h6 class="fw-bold mb-2 text-dark">🔥 สั่งเตา / น้ำซุป</h6>
                    <select id="stoveType" class="form-select mb-2" onchange="toggleSoup()">
                        <option value="">-- เลือกประเภทเตา --</option>
                        <option value="เตาหมูกระทะ|50">เตาหมูกระทะ (+50 บ.)</option>
                        <option value="หม้อชาบู|20">หม้อชาบู (+20 บ.)</option>
                    </select>
                    <div id="soupSection" style="display:none;">
                        <select id="soup1" class="form-select mb-2"></select>
                        <div id="soup2Div" style="display:none;">
                            <select id="soup2" class="form-select mb-2"></select>
                        </div>
                    </div>
                    <button class="btn btn-warning w-100 fw-bold" onclick="orderStove()">ส่งรายการเตา 📤</button>
                </div>

                <!-- เพิ่มลูกค้า -->
                <div class="card p-3 mb-3" style="border-left: 4px solid #0d6efd;">
                    <h6 class="fw-bold mb-2 text-primary">👥 ลูกค้ามาเพิ่ม</h6>
                    <div class="d-flex gap-2">
                        <input type="number" id="addAdultQty" min="0" value="0" class="form-control text-center" placeholder="ผู้ใหญ่">
                        <input type="number" id="addChildQty" min="0" value="0" class="form-control text-center" placeholder="เด็ก">
                        <button class="btn btn-primary fw-bold px-3 text-nowrap" onclick="addPerson()">เพิ่ม</button>
                    </div>
                </div>

                <!-- สั่งอาหาร -->
                <div class="card p-3 mb-3" style="border-left: 4px solid #dc3545;">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h6 class="fw-bold m-0 text-danger">🍲 สั่งอาหาร / เครื่องดื่ม</h6>
                        <select id="menuCategory" class="form-select form-select-sm w-auto" onchange="renderMenuGrid()">
                            <option value="all">-- ทุกหมวดหมู่ --</option>
                        </select>
                    </div>
                    <div id="menuGrid" class="row g-2 mb-3" style="max-height: 350px; overflow-y: auto;"></div>
                    <button class="btn btn-danger w-100 fw-bold shadow-sm" onclick="submitOrder()">📤 ส่งอาหารเข้าครัว</button>
                </div>
            </div>
        </div>

        <!-- ฝั่งขวา: สรุปบิล -->
        <div class="col-lg-5">
            <div id="resultArea">
                <div class="card p-4 text-center text-muted">กำลังตรวจสอบโต๊ะ...</div>
            </div>
        </div>
    </div>

    <!-- Firebase JS SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // 1. Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCcSSovygMSoS6PYX_sS8T-7i62qvw_Agk",
            authDomain: "buffet-system-9b165.firebaseapp.com",
            projectId: "buffet-system-9b165",
            storageBucket: "buffet-system-9b165.firebasestorage.app",
            messagingSenderId: "144497251618",
            appId: "1:144497251618:web:cf9e2984e4c6a11a3dc17b",
            measurementId: "G-82JK3EL1HL"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // 2. Global Variables
        const urlParams = new URLSearchParams(window.location.search);
        const currentTableId = urlParams.get('table');
        
        let globalMenus = [];
        let currentPkgPrice = "0";
        let tableData = null;
        let currentShiftId = "";
        let currentShiftName = "";

        // 3. Init Function
        window.onload = function() {
            if (!currentTableId) {
                document.getElementById('resultArea').innerHTML = '<div class="card p-4 text-center text-danger">⚠️ ไม่พบระบุเลขโต๊ะใน URL (?table=X)</div>';
                return;
            }
            
            document.getElementById('tableTitle').innerText = "โต๊ะ: " + currentTableId;

            // รันขนานกันทันที ไม่บล็อกกัน
            initTableListener();
            loadShift();
            loadDropdowns();
        };

        // 4. Load Data
        async function loadShift() {
            try {
                const snap = await db.collection("shifts").where("status", "==", "open").limit(1).get();
                if (!snap.empty) {
                    const doc = snap.docs[0];
                    currentShiftId = doc.id;
                    currentShiftName = doc.data().staffName || "พนักงาน";
                    document.getElementById('shiftStatus').className = "badge bg-success";
                    document.getElementById('shiftStatus').innerText = "กะ: " + currentShiftName;
                } else {
                    document.getElementById('shiftStatus').className = "badge bg-danger";
                    document.getElementById('shiftStatus').innerText = "ยังไม่เปิดกะ";
                }
            } catch (e) {
                console.error("Shift Error:", e);
                document.getElementById('shiftStatus').innerText = "โหลดกะล้มเหลว";
            }
        }

        async function loadDropdowns() {
            try {
                // Packages
                const pSnap = await db.collection("packages").get();
                let pHtml = "";
                pSnap.forEach(doc => {
                    let p = doc.data();
                    pHtml += '<option value="' + p.price + '">' + p.name + ' (' + p.price + ' บ.)</option>';
                });
                document.getElementById('pkg').innerHTML = pHtml;

                // Soups
                const sSnap = await db.collection("soups").get();
                let sHtml = "";
                sSnap.forEach(doc => {
                    let s = doc.data();
                    let pText = s.price > 0 ? ' (+' + s.price + ')' : '';
                    sHtml += '<option value="' + s.name + '|' + s.price + '">' + s.name + pText + '</option>';
                });
                document.getElementById('soup1').innerHTML = sHtml;
                document.getElementById('soup2').innerHTML = sHtml;

                // Menus
                const mSnap = await db.collection("menu").get();
                globalMenus = [];
                mSnap.forEach(doc => {
                    let data = doc.data();
                    globalMenus.push({
                        id: doc.id,
                        name: data.name,
                        price: parseFloat(data.price) || 0,
                        category: data.category || "อื่นๆ",
                        allowed: data.allowedPackage || data.allowed || ""
                    });
                });

                // ✅ เพิ่มบรรทัดนี้: โหลดเมนูเสร็จปุ๊บ ให้วาดรายการอาหารขึ้นหน้าจอทันที
                prepareMenuCategories();

            } catch (e) {
                console.error("Load Data Error:", e);
            }
        }
        
        function initTableListener() {
            const tableRef = db.collection("tables").doc(String(currentTableId));
            
            tableRef.onSnapshot(doc => {
                if (doc.exists) {
                    tableData = doc.data();
                } else {
                    tableData = { status: "ว่าง", packagePrice: 0 };
                }

                let status = tableData.status || "ว่าง";
                
                if (status === "ว่าง" || status === "free") {
                    document.getElementById('sectionOpenTable').style.display = "block";
                    document.getElementById('sectionManageTable').style.display = "none";
                    document.getElementById('resultArea').innerHTML = '<div class="card p-4 text-center text-muted">โต๊ะว่าง กรุณาเปิดโต๊ะเพื่อเริ่มสั่งอาหาร</div>';
                } else {
                    document.getElementById('sectionOpenTable').style.display = "none";
                    document.getElementById('sectionManageTable').style.display = "block";
                    currentPkgPrice = String(tableData.packagePrice || "0");
                    
                    prepareMenuCategories();
                    listenToOrders();
                }
            }, error => {
                console.error("Table Listener Error:", error);
                // แสดงข้อผิดพลาดจาก Firebase ลงบนหน้าจอทันที
                document.getElementById('resultArea').innerHTML = '<div class="card p-4 text-center text-danger">' +
                    '<h6 class="fw-bold">❌ เกิดข้อผิดพลาดจาก Firebase</h6>' +
                    '<div class="small text-muted">' + error.message + '</div>' +
                '</div>';
            });
        }

        // 6. Actions (Open, Add Person, Stove)
        async function openNewTable() {
            const adult = parseInt(document.getElementById('pplAdult').value) || 0;
            const child = parseInt(document.getElementById('pplChild').value) || 0;
            const pkg = document.getElementById('pkg');
            const pkgPrice = parseFloat(pkg.value) || 0;
            const pkgName = pkg.options[pkg.selectedIndex].text;
            
            if (adult + child <= 0) {
                Swal.fire("เตือน", "กรุณาระบุจำนวนลูกค้า", "warning");
                return;
            }

            const childPrice = Math.ceil(pkgPrice / 2);
            const totalAmount = (adult * pkgPrice) + (child * childPrice);
            const detailText = "เปิดโต๊ะ (ผู้ใหญ่ " + adult + ", เด็ก " + child + " - " + pkgName + ")";

            try {
                await db.collection("tables").doc(String(currentTableId)).set({
                    tableNo: String(currentTableId),
                    status: "ไม่ว่าง",
                    packagePrice: pkgPrice,
                    adults: adult,
                    children: child,
                    totalPeople: adult + child
                }, { merge: true });

                // แก้ไขพารามิเตอร์ตัวสุดท้ายเป็น true เพื่อส่งเข้าครัว
                await sendOrderToFirestore("เปิดโต๊ะ", detailText, totalAmount, true);
                Swal.fire({ icon: 'success', title: 'เปิดโต๊ะแล้ว', timer: 1000, showConfirmButton: false });
            } catch (e) {
                Swal.fire("ผิดพลาด", e.message, "error");
            }
        }

        async function addPerson() {
            const adult = parseInt(document.getElementById('addAdultQty').value) || 0;
            const child = parseInt(document.getElementById('addChildQty').value) || 0;
            
            if (adult === 0 && child === 0) {
                Swal.fire("เตือน", "ใส่จำนวนคนก่อนกดเพิ่ม", "warning");
                return;
            }

            const pkgPrice = parseFloat(tableData.packagePrice) || 0;
            const childPrice = Math.ceil(pkgPrice / 2);
            const totalAmount = (adult * pkgPrice) + (child * childPrice);
            
            let details = "เพิ่มลูกค้า: ผู้ใหญ่ " + adult + ", เด็ก " + child;

            try {
                await db.collection("tables").doc(String(currentTableId)).update({
                    adults: (parseInt(tableData.adults) || 0) + adult,
                    children: (parseInt(tableData.children) || 0) + child,
                    totalPeople: (parseInt(tableData.totalPeople) || 0) + adult + child
                });

                // แก้ไขพารามิเตอร์ตัวสุดท้ายเป็น true เพื่อส่งเข้าครัว
                await sendOrderToFirestore("เพิ่มลูกค้า", details, totalAmount, true);
                
                document.getElementById('addAdultQty').value = "0";
                document.getElementById('addChildQty').value = "0";
                Swal.fire({ icon: 'success', title: 'เพิ่มลูกค้าแล้ว', timer: 1000, showConfirmButton: false });
            } catch (e) {
                Swal.fire("ผิดพลาด", e.message, "error");
            }
        }

        function toggleSoup() {
            const stove = document.getElementById('stoveType').value;
            const section = document.getElementById('soupSection');
            const soup2 = document.getElementById('soup2Div');
            
            if(stove !== "") {
                section.style.display = "block";
                if(stove.includes("หม้อชาบู")) {
                    soup2.style.display = "block";
                } else {
                    soup2.style.display = "none";
                }
            } else {
                section.style.display = "none";
            }
        }

        async function orderStove() {
            const stoveVal = document.getElementById('stoveType').value;
            if (!stoveVal) {
                Swal.fire("เตือน", "เลือกเตาก่อน", "warning");
                return;
            }
            
            let stoveParts = stoveVal.split('|');
            let stoveName = stoveParts[0];
            let stovePrice = parseFloat(stoveParts[1]) || 0;

            let s1Parts = document.getElementById('soup1').value.split('|');
            let soupTotal = parseFloat(s1Parts[1]) || 0;
            let detail = stoveName + " (ซุป: " + s1Parts[0];

            if (stoveName.includes("หม้อชาบู")) {
                let s2Parts = document.getElementById('soup2').value.split('|');
                soupTotal += parseFloat(s2Parts[1]) || 0;
                detail += " + " + s2Parts[0];
            }
            detail += ")";

            await sendOrderToFirestore("สั่งเตา", detail, stovePrice + soupTotal, true);
            
            document.getElementById('stoveType').value = "";
            toggleSoup();
            Swal.fire({ icon: 'success', title: 'ส่งเตาแล้ว', timer: 1000, showConfirmButton: false });
        }

        // 7. Menu UI
        function prepareMenuCategories() {
            let categories = [];
            globalMenus.forEach(m => {
                let allowed = String(m.allowed || "");
                if (allowed === "" || allowed.includes(currentPkgPrice)) {
                    let cat = m.category || "อื่นๆ";
                    if (!categories.includes(cat)) {
                        categories.push(cat);
                    }
                }
            });
            
            let catHtml = '<option value="all">-- ทุกหมวดหมู่ --</option>';
            categories.forEach(c => {
                catHtml += '<option value="' + c + '">' + c + '</option>';
            });
            document.getElementById('menuCategory').innerHTML = catHtml;
            renderMenuGrid();
        }

        function renderMenuGrid() {
            const selectedCat = document.getElementById('menuCategory').value;
            let html = "";
            
            globalMenus.forEach((m, index) => {
                let allowed = String(m.allowed || "");
                let cat = m.category || "อื่นๆ";
                
                if (allowed === "" || allowed.includes(currentPkgPrice)) {
                    if (selectedCat === "all" || selectedCat === cat) {
                        let pText = m.price > 0 ? '<span class="text-danger small">(+' + m.price + ')</span>' : '';
                        html += '<div class="col-12 col-md-6">' +
                                    '<div class="d-flex justify-content-between align-items-center p-2 border rounded bg-white shadow-sm">' +
                                        '<div class="fw-bold text-dark text-truncate pe-2" style="font-size:14px;">' + m.name + pText + '</div>' +
                                        '<div class="d-flex align-items-center">' +
                                            '<button class="btn btn-sm btn-outline-secondary" onclick="changeQty(' + index + ', -1)">-</button>' +
                                            '<input type="number" id="qty_' + index + '" class="form-control text-center mx-1 p-0 border-0 fw-bold text-primary bg-transparent" value="0" style="width: 35px;" readonly>' +
                                            '<button class="btn btn-sm btn-outline-secondary" onclick="changeQty(' + index + ', 1)">+</button>' +
                                        '</div>' +
                                    '</div>' +
                                '</div>';
                    }
                }
            });
            document.getElementById('menuGrid').innerHTML = html;
        }

        function changeQty(index, amount) {
            const input = document.getElementById('qty_' + index);
            if (input) {
                let val = parseInt(input.value) + amount;
                if (val >= 0) input.value = val;
            }
        }

                async function submitOrder() {
            let items = [];
            let totalAmount = 0;
            
            globalMenus.forEach((m, index) => {
                const input = document.getElementById('qty_' + index);
                if (input) {
                    let qty = parseInt(input.value);
                    if (qty > 0) {
                        // เก็บรายการลง Array โดยใช้รูปแบบ ชื่อ xจำนวน
                        items.push(m.name + ' x' + qty);
                        totalAmount += (m.price * qty);
                        input.value = 0; // เคลียร์ช่องจำนวน
                    }
                }
            });
            
            if (items.length === 0) {
                Swal.fire("เตือน", "กรุณาเลือกอาหารก่อน", "warning");
                return;
            }

            // ส่งข้อมูลครั้งเดียว โดยคั่นแต่ละรายการด้วย \n (ขึ้นบรรทัดใหม่)
            await sendOrderToFirestore("สั่งอาหาร", items.join("\n"), totalAmount, true);
            
            Swal.fire({ icon: 'success', title: 'ส่งอาหารเข้าครัวแล้ว', timer: 1000, showConfirmButton: false });
        }
        
        // 8. DB Writers & Readers
        async function sendOrderToFirestore(actionStr, detailStr, amountNum, isKitchen) {
            try {
                await db.collection("tables").doc(String(currentTableId)).collection("orders").add({
                    action: actionStr,
                    details: detailStr,
                    amount: amountNum || 0,
                    kitchenStatus: isKitchen ? "เตรียม" : "-",
                    shiftId: currentShiftId,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (e) {
                console.error("Order Error:", e);
            }
        }

        function listenToOrders() {
            const orderRef = db.collection("tables").doc(String(currentTableId)).collection("orders").orderBy("timestamp");
            
            orderRef.onSnapshot(snap => {
                let totalAmount = 0;
                let html = '<div class="card p-3 shadow-sm" style="border-top: 4px solid #343a40;">' +
                           '<h5 class="fw-bold mb-3">🧾 บิลโต๊ะ ' + currentTableId + '</h5>' +
                           '<div style="max-height: 400px; overflow-y: auto; overflow-x: hidden;" class="pe-2 mb-3">';
                
                if(snap.empty) {
                    html += '<div class="text-center text-muted py-3">ยังไม่มีรายการสั่ง</div>';
                } else {
                    snap.forEach(doc => {
                        let item = doc.data();
                        let docId = doc.id;
                        let amt = parseFloat(item.amount) || 0;
                        totalAmount += amt;

                        let safeDetail = "";
                        if(item.details) {
                            safeDetail = item.details.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                        }
                        
                        let badge = "";
                        if (item.kitchenStatus === "เตรียม") badge = '<span class="badge bg-warning text-dark ms-1">ครัวทำ</span>';
                        if (item.kitchenStatus === "เสร็จ") badge = '<span class="badge bg-success ms-1">เสิร์ฟแล้ว</span>';

                        html += '<div class="bill-item d-flex justify-content-between align-items-start">' +
                                    '<div style="flex: 1; padding-right: 5px;">' +
                                        '<div class="fw-bold">' + item.action + ' <span class="text-danger">(' + amt + ' บ.)</span></div>' +
                                        '<div class="text-muted small">' + (item.details || "") + ' ' + badge + '</div>' +
                                    '</div>' +
                                    '<div>' +
                                        '<button class="btn btn-sm btn-outline-danger py-0 px-1" onclick="deleteOrder(\'' + docId + '\')">🗑</button>' +
                                    '</div>' +
                                '</div>';
                    });
                }

                html += '</div>' +
                        '<div class="bg-light p-3 rounded text-center border mb-3">' +
                            '<div class="text-muted small fw-bold">ยอดรวมทั้งหมด</div>' +
                            '<div class="text-danger fw-bold fs-3">' + totalAmount.toLocaleString() + ' ฿</div>' +
                        '</div>' +
                        '<button class="btn btn-dark w-100 fw-bold py-2" onclick="goCheckout()" ' + (snap.empty ? 'disabled' : '') + '>' +
                            '💳 เช็คบิล / สรุปยอด' +
                        '</button>' +
                    '</div>';
                
                document.getElementById('resultArea').innerHTML = html;
            }, error => {
                console.error("Orders Listener Error:", error);
            });
        }

        async function deleteOrder(docId) {
            Swal.fire({
                title: 'ยืนยันการลบ?',
                text: "ต้องการลบรายการนี้ใช่หรือไม่?",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'ลบเลย',
                cancelButtonText: 'ยกเลิก'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        const orderRef = db.collection("orders").doc(docId);
                        const docSnap = await orderRef.get();
                        
                        if (docSnap.exists) {
                            const data = docSnap.data();
                            
                            // ลองหักลบจำนวนคนเฉพาะเมื่อข้อมูลครบถ้วน
                            try {
                                if (data.category === "เปิดโต๊ะ" || data.category === "เพิ่มลูกค้า" || (data.details && data.details.includes("ผู้ใหญ่"))) {
                                    let adultMatch = data.details ? data.details.match(/ผู้ใหญ่\s*(\d+)/) : null;
                                    let childMatch = data.details ? data.details.match(/เด็ก\s*(\d+)/) : null;
                                    
                                    let delAdult = adultMatch ? parseInt(adultMatch[1]) : 0;
                                    let delChild = childMatch ? parseInt(childMatch[1]) : 0;
                                    
                                    if (delAdult > 0 || delChild > 0) {
                                        const urlParams = new URLSearchParams(window.location.search);
                                        let activeTableId = (typeof currentTableId !== 'undefined' && currentTableId) ? currentTableId : urlParams.get('table');
                                        
                                        if (activeTableId) {
                                            const tableRef = db.collection("tables").doc(String(activeTableId));
                                            const tableDoc = await tableRef.get();
                                            
                                            if (tableDoc.exists) {
                                                let tData = tableDoc.data();
                                                let newAdults = Math.max(0, (parseInt(tData.adults) || 0) - delAdult);
                                                let newChildren = Math.max(0, (parseInt(tData.children) || 0) - delChild);
                                                let newTotal = newAdults + newChildren;
                                                
                                                await tableRef.update({
                                                    adults: newAdults,
                                                    children: newChildren,
                                                    totalPeople: newTotal,
                                                    people: newTotal
                                                });
                                            }
                                        }
                                    }
                                }
                            } catch (err) {
                                console.log("ข้ามการหักลบยอดคน:", err);
                            }
                        }
                        
                        // ลบรายการออกจากฐานข้อมูล (ทำงานเสมอไม่ว่าจะเกิดข้อผิดพลาดด้านบนหรือไม่)
                        await orderRef.delete();
                        
                        Swal.fire({ 
                            icon: 'success', 
                            title: 'ลบเรียบร้อย', 
                            timer: 1000, 
                            showConfirmButton: false 
                        }).then(() => {
                            location.reload();
                        });
                        
                    } catch (error) {
                        Swal.fire("ผิดพลาด", error.message, "error");
                    }
                }
            });
        }
        function goCheckout() {
            window.location.href = 'checkout.html?table=' + currentTableId;
        }
    </script>
</body>
</html>
