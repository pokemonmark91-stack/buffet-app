<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สั่งอาหารบุฟเฟต์</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 15px; font-family: sans-serif; }
        .list-group-item { border-radius: 8px; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="container" style="max-width: 600px;">
        <h3 class="text-center mb-4">🔥 เมนูบุฟเฟต์</h3>
        
        <div class="card p-3 mb-3">
            <label class="form-label">เลือกแพ็กเกจ:</label>
            <select id="packageSelect" class="form-select" onchange="loadMenu()">
                <option value="" selected disabled>-- เลือกแพ็กเกจ --</option>
                <option value="99">99 บาท</option>
                <option value="119">119 บาท</option>
                <option value="159">159 บาท</option>
            </select>
        </div>

        <div id="menuContainer">เลือกแพ็กเกจเพื่อดูเมนู...</div>
    </div>

    <script>
        // 🔴 อย่าลืมเปลี่ยนเป็นลิงก์ของคุณที่ลงท้ายด้วย /exec
        const API_URL = "https://script.google.com/macros/s/AKfycbw8evmdw3z6vEEchV71qHjUIeO37iyEWmjFDArfhNoiFvo9Yr8TeM-QY-oEszfoJuYt/exec";

        function loadMenu() {
            const packagePrice = document.getElementById("packageSelect").value;
            const container = document.getElementById("menuContainer");
            container.innerHTML = "กำลังดึงข้อมูลจาก Google Sheets...";

            fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" }, // เปลี่ยนเป็น json
                body: JSON.stringify({ action: "getMenu", packagePrice: packagePrice })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    let html = '<ul class="list-group">';
                    data.menu.forEach(item => {
                        html += `<li class="list-group-item">
                                    <strong>${item.name}</strong><br>
                                    <small class="text-muted">${item.category}</small>
                                 </li>`;
                    });
                    html += '</ul>';
                    container.innerHTML = html;
                } else {
                    container.innerHTML = "ไม่พบข้อมูล: " + data.message;
                }
            })
            .catch(err => {
                container.innerHTML = "Error: ไม่สามารถเชื่อมต่อกับ Sheets ได้";
                console.error(err);
            });
        }
    </script>
</body>
</html>
