<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสั่งอาหารบุฟเฟต์</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 15px; font-family: sans-serif; }
        .card { margin-bottom: 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <div class="container" style="max-width: 600px;">
        <h3 class="text-center mb-4">🔥 สั่งอาหารบุฟเฟต์</h3>

        <!-- ส่วนที่ 1: ข้อมูลโต๊ะและแพ็กเกจ -->
        <div class="card p-3">
            <h5>1. ข้อมูลโต๊ะและแพ็กเกจ</h5>
            <div class="mb-3">
                <label class="form-label">หมายเลขโต๊ะ:</label>
                <input type="text" id="tableNo" class="form-control" placeholder="เช่น A1, T02">
            </div>
            <div class="mb-3">
                <label class="form-label">เลือกแพ็กเกจ:</label>
                <select id="packageSelect" class="form-select" onchange="loadMenu()">
                    <option value="" selected disabled>-- กรุณาเลือกแพ็กเกจ --</option>
                    <option value="99">99 บาท - ก๋วยเตี๋ยว</option>
                    <option value="119">119 บาท - ชาบูหมูกระทะ</option>
                    <option value="159">159 บาท - ชาบูหมูกระทะพลัส (All Access)</option>
                </select>
            </div>
        </div>

        <!-- ส่วนที่ 2: เลือกเตาและน้ำซุป -->
        <div class="card p-3">
            <h5>2. เลือกเตาและน้ำซุป</h5>
            <div class="mb-3">
                <label class="form-label">เลือกเตา:</label>
                <select id="stoveSelect" class="form-select">
                    <option value="หมูกระทะ">เตาหมูกระทะ</option>
                    <option value="ชาบู">หม้อชาบู</option>
                    <option value="เตาคู่ (+50)">เตาคู่ (+50 บาท)</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">เลือกน้ำซุป:</label>
                <select id="soupSelect" class="form-select">
                    <option value="น้ำใส">ซุปน้ำใส</option>
                    <option value="ดำ">ซุปน้ำดำ</option>
                    <option value="หมาล่า (+30)">ซุปหมาล่า (+30 บาท)</option>
                </select>
            </div>
        </div>

        <!-- ส่วนที่ 3: รายการเมนูอาหาร -->
        <div class="card p-3">
            <h5>3. เลือกรายการอาหาร</h5>
            <div id="menuContainer" class="text-muted">กรุณาเลือกแพ็กเกจด้านบนก่อนเพื่อแสดงรายการอาหาร...</div>
        </div>

        <!-- ปุ่มยืนยันคำสั่งซื้อ -->
        <button class="btn btn-danger w-100 py-3 fs-5 mb-5" onclick="submitOrder()">🚀 ยืนยันการสั่งอาหาร</button>
    </div>

    <script>
        // 🔴 นำ Web App URL ที่ลงท้ายด้วย /exec ของคุณมาใส่ตรงนี้
        const API_URL = "https://script.google.com/macros/s/AKfycbw8evmdw3z6vEEchV71qHjUIeO37iyEWmjFDArfhNoiFvo9Yr8TeM-QY-oEszfoJuYt/exec";

        // ฟังก์ชันดึงเมนู
        function loadMenu() {
            const packagePrice = document.getElementById("packageSelect").value;
            const menuContainer = document.getElementById("menuContainer");
            
            if (!packagePrice) return;
            menuContainer.innerHTML = "กำลังโหลดเมนู...";

            fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({ action: "getMenu", packagePrice: packagePrice })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    if (data.menu.length === 0) {
                        menuContainer.innerHTML = "ไม่พบรายการเมนูในแพ็กเกจนี้";
                        return;
                    }
                    
                    let html = '<div class="list-group">';
                    data.menu.forEach(item => {
                        html += `<div class="list-group-item d-flex justify-content-between align-items-center">
                                    <div>
                                        <strong>${item.name}</strong><br>
                                        <small class="text-muted">${item.category}</small>
                                    </div>
                                    <span>${item.price > 0 ? item.price + ' บาท' : 'รวมในแพ็กเกจ'}</span>
                                 </div>`;
                    });
                    html += '</div>';
                    menuContainer.innerHTML = html;
                } else {
                    menuContainer.innerHTML = "เกิดข้อผิดพลาดในการโหลดเมนู";
                }
            })
            .catch(err => {
                console.error(err);
                menuContainer.innerHTML = "ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้";
            });
        }

        // ฟังก์ชันส่งออเดอร์
        function submitOrder() {
            const tableNo = document.getElementById("tableNo").value;
            const packageName = document.getElementById("packageSelect").value;
            
            if (!tableNo) {
                alert("กรุณาระบุหมายเลขโต๊ะก่อนครับ");
                return;
            }
            if (!packageName) {
                alert("กรุณาเลือกแพ็กเกจก่อนครับ");
                return;
            }

            const orderData = {
                tableNo: tableNo,
                packageName: packageName,
                stoveSetup: document.getElementById("stoveSelect").value,
                soupSetup: document.getElementById("soupSelect").value,
                totalPrice: 0 
            };

            fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({ action: "saveOrder", orderData: orderData })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    alert("สั่งอาหารสำเร็จ! รหัสออเดอร์: " + data.orderId);
                } else {
                    alert("เกิดข้อผิดพลาดในการบันทึกออเดอร์");
                }
            })
            .catch(err => {
                console.error(err);
                alert("ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้");
            });
        }
    </script>
</body>
</html>
