<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสั่งอาหารบุฟเฟต์</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 15px; font-family: sans-serif; }
        .card { margin-bottom: 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <div class="container" style="max-width: 600px;">
        <h3 class="text-center mb-4">🔥 สั่งอาหารบุฟเฟต์</h3>

        <div class="card p-3">
            <h5>1. ข้อมูลโต๊ะและแพ็กเกจ</h5>
            <div class="mb-3">
                <label class="form-label">หมายเลขโต๊ะ:</label>
                <input type="text" id="tableNo" class="form-control" placeholder="เช่น A1, T02">
            </div>
            <div class="mb-3">
                <label class="form-label">เลือกแพ็กเกจ:</label>
                <select id="packageSelect" class="form-select" onchange="loadMenu()">
                    <option value="" selected disabled>-- กรุณาเลือกแพ็กเกจ --</option>
                    <option value="99">99 บาท - ชาบูหมูกระทะ</option>
                    <option value="119">119 บาท - ชาบูหมูกระทะซีฟู้ด</option>
                    <option value="159">159 บาท - ชาบูหมูกระทะพลัส (All Access)</option>
                </select>
            </div>
        </div>

        <div class="card p-3">
            <h5>2. เลือกเตาและน้ำซุป</h5>
            <div class="mb-3">
                <label class="form-label">เลือกเตา:</label>
                <select id="stoveSelect" class="form-select">
                    <option value="หมูกระทะ">เตาหมูกระทะ</option>
                    <option value="ชาบู">หม้อชาบู</option>
                    <option value="เตาคู่ (+50)">เตาคู่ (+50 บาท)</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">เลือกน้ำซุป:</label>
                <select id="soupSelect" class="form-select">
                    <option value="น้ำใส">ซุปน้ำใส</option>
                    <option value="ดำ">ซุปน้ำดำ</option>
                    <option value="หมาล่า (+30)">ซุปหมาล่า (+30 บาท)</option>
                </select>
            </div>
        </div>

        <div class="card p-3">
            <h5>3. เลือกรายการอาหาร</h5>
            <div id="menuContainer" class="text-muted">กรุณาเลือกแพ็กเกจด้านบนก่อนเพื่อแสดงรายการอาหาร...</div>
        </div>

        <button class="btn btn-danger w-100 py-3 fs-5 mb-5" onclick="submitOrder()">🚀 ยืนยันการสั่งอาหาร</button>
    </div>

    <script>
        // 🔴 นำ Web App URL ของคุณที่ลงท้ายด้วย /exec มาใส่แทนที่ข้อความด้านล่างนี้
        const API_URL = "https://script.google.com/macros/s/AKfycbw8evmdw3z6vEEchV71qHjUIeO37iyEWmjFDArfhNoiFvo9Yr8TeM-QY-oEszfoJuYt/exec";

        function loadMenu() {
            const packagePrice = document.getElementById("packageSelect").value;
            const menuContainer = document.getElementById("menuContainer");
            
            if (!packagePrice) return;
            menuContainer.innerHTML = "กำลังโหลดเมนู...";

            // ส่งข้อมูลไปยัง Google Apps Script
            fetch(API_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({ action: "getMenu", packagePrice: packagePrice })
            })
            .then(() => {
                alert("โหลดข้อมูลแพ็กเกจ " + packagePrice + " เรียบร้อย!");
            })
            .catch(err => {
                console.error(err);
                menuContainer.innerHTML = "เกิดข้อผิดพลาดในการโหลดเมนู";
            });
        }

        function submitOrder() {
            alert("ฟังก์ชันบันทึกออเดอร์พร้อมใช้งานแล้ว!");
        }
    </script>
</body>
</html>
