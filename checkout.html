<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ชำระเงิน / เช็คบิล</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .receipt-card { background: white; border-radius: 12px; border-top: 6px solid #2c3e50; }
        .payment-card { background: white; border-radius: 12px; border-top: 6px solid #27ae60; }
        .dashed-line { border-bottom: 2px dashed #ccc; margin: 15px 0; }
    </style>
</head>
<body class="container py-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <button onclick="goBack()" class="btn btn-outline-secondary fw-bold">◀ ย้อนกลับไปโต๊ะ</button>
        <h3 class="fw-bold m-0 text-dark">💳 ชำระเงิน โต๊ะ <span id="displayTableNo" class="text-primary">-</span></h3>
        <div style="width: 100px;"></div>
    </div>

    <div class="row g-4">
        <!-- ฝั่งซ้าย: ใบเสร็จ / สรุปรายการอาหาร -->
        <div class="col-md-5">
            <div class="card receipt-card shadow-sm p-4">
                <h5 class="fw-bold text-center mb-3">🧾 สรุปรายการอาหาร</h5>
                <ul class="list-unstyled mb-0" id="receiptItems" style="max-height: 400px; overflow-y: auto;">
                    <li class="text-center text-muted">กำลังโหลดบิล...</li>
                </ul>
                <div class="dashed-line"></div>
                <div class="d-flex justify-content-between align-items-center">
                    <span class="fw-bold text-secondary">ยอดรวมก่อนหักส่วนลด:</span>
                    <span class="fw-bold fs-5" id="subTotalTxt">0 บาท</span>
                </div>
            </div>
        </div>

        <!-- ฝั่งขวา: การชำระเงินและแจกแต้ม -->
        <div class="col-md-7">
            <div class="card payment-card shadow-sm p-4">
                
                <!-- 1. ส่วนลด -->
                <h6 class="fw-bold text-dark mb-3">💡 ส่วนลด</h6>
                <div class="row g-2 mb-4">
                    <div class="col-6">
                        <input type="number" id="discountVal" class="form-control" value="0" min="0" oninput="calculateNetTotal()" placeholder="ใส่ยอดลด">
                    </div>
                    <div class="col-6">
                        <select id="discountType" class="form-select" onchange="calculateNetTotal()">
                            <option value="บาท">บาท (฿)</option>
                            <option value="%">เปอร์เซ็นต์ (%)</option>
                        </select>
                    </div>
                </div>

                <!-- 2. ยอดสุทธิ -->
                <div class="alert alert-success d-flex justify-content-between align-items-center py-3 mb-4">
                    <span class="fw-bold fs-5 m-0 text-success">ยอดที่ต้องชำระ:</span>
                    <span id="netTotalTxt" class="fw-bold m-0 text-success" style="font-size: 28px;">0 บาท</span>
                </div>

                <!-- 3. ช่องทางการชำระเงิน -->
                <h6 class="fw-bold text-dark mb-3">💰 ช่องทางการชำระเงิน</h6>
                <select id="payType" class="form-select mb-3" onchange="toggleCashInput()">
                    <option value="เงินโอน">📲 เงินโอน / สแกน QR Code</option>
                    <option value="เงินสด">💵 เงินสด</option>
                </select>

                <div id="cashInputDiv" style="display: none;" class="mb-4 p-3 bg-light rounded border">
                    <label class="form-label small fw-bold text-secondary">รับเงินสดมา (บาท):</label>
                    <input type="number" id="cashReceived" class="form-control form-control-lg mb-2 text-center text-primary fw-bold" placeholder="0" oninput="calculateChange()">
                    <div id="changeDisplay" class="text-center fw-bold text-secondary fs-5">เงินทอน: 0 บาท</div>
                </div>

                <div class="dashed-line"></div>

                <!-- 4. แจกแต้มสมาชิก -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="fw-bold text-dark m-0">🎁 แจกแต้มสมาชิก</h6>
                    <span class="badge bg-primary" id="suggestedPoints">ได้แต้มรวม: 0 แต้ม</span>
                </div>
                <div id="membersList" class="mb-4">
                    <div class="text-muted small">กำลังโหลดข้อมูลสมาชิก...</div>
                </div>

                <!-- ปุ่มยืนยัน -->
                <button id="btnConfirm" onclick="confirmPayment()" class="btn btn-success btn-lg w-100 fw-bold shadow">
                    ✅ ยืนยันรับชำระเงิน และปิดโต๊ะ
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase JS SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // --- 1. ตั้งค่า Firebase ---
        const firebaseConfig = {
            apiKey: "AIzaSyCcSSovygMSoS6PYX_sS8T-7i62qvw_Agk",
            authDomain: "buffet-system-9b165.firebaseapp.com",
            projectId: "buffet-system-9b165",
            storageBucket: "buffet-system-9b165.firebasestorage.app",
            messagingSenderId: "144497251618",
            appId: "1:144497251618:web:cf9e2984e4c6a11a3dc17b",
            measurementId: "G-82JK3EL1HL"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- 2. ตัวแปรระบบ ---
        const urlParams = new URLSearchParams(window.location.search);
        const currentTableId = urlParams.get('table');
        let totalBillAmount = 0;
        let totalEarnedPoints = 0;

        window.onload = function() {
            if (!currentTableId) {
                alert("ไม่พบเลขโต๊ะ กรุณาเลือกโต๊ะใหม่");
                window.location.href = "dashboard.html";
                return;
            }
            document.getElementById('displayTableNo').innerText = currentTableId;
            loadBillDetails();
        };

        function goBack() {
            window.location.href = "order.html?table=" + currentTableId;
        }

        // --- 3. ดึงข้อมูลบิลและสมาชิก ---
        async function loadBillDetails() {
            try {
                totalBillAmount = 0;
                let html = "";

                // A. ดึงข้อมูลโต๊ะ
                const tableDoc = await db.collection("tables").doc(currentTableId).get();
                let activeMembers = [];
                
                if (tableDoc.exists) {
                    const tableData = tableDoc.data();
                    activeMembers = tableData.activeMembers || [];

                    const adults = parseInt(tableData.adults) || 0;
                    const children = parseInt(tableData.children) || 0;
                    const pkgPrice = parseFloat(tableData.packagePrice) || 0;

                    if (adults > 0 && pkgPrice > 0) {
                        const adultTotal = adults * pkgPrice;
                        totalBillAmount += adultTotal;
                        html += "<li class='d-flex justify-content-between align-items-start mb-2 pb-2 border-bottom'>" +
                                    "<div>" +
                                        "<span class='fw-bold'>บุฟเฟต์ผู้ใหญ่ (" + adults + " ท่าน)</span><br>" +
                                        "<small class='text-muted'>ท่านละ " + pkgPrice.toLocaleString() + " บ.</small>" +
                                    "</div>" +
                                    "<span class='text-danger fw-bold text-nowrap'>" + adultTotal.toLocaleString() + " บ.</span>" +
                                "</li>";
                    }

                    if (children > 0) {
                        const childPrice = parseFloat(tableData.childPackagePrice || tableData.childPrice) || (pkgPrice / 2);
                        const childTotal = children * childPrice;
                        if (childTotal > 0) {
                            totalBillAmount += childTotal;
                            html += "<li class='d-flex justify-content-between align-items-start mb-2 pb-2 border-bottom'>" +
                                        "<div>" +
                                            "<span class='fw-bold'>บุฟเฟต์เด็ก (" + children + " ท่าน)</span><br>" +
                                            "<small class='text-muted'>ท่านละ " + childPrice.toLocaleString() + " บ.</small>" +
                                        "</div>" +
                                        "<span class='text-danger fw-bold text-nowrap'>" + childTotal.toLocaleString() + " บ.</span>" +
                                    "</li>";
                        }
                    }
                }

                // B. ดึงรายการอาหารเพิ่มเติมจาก Subcollection 'orders'
                let ordersSnap;
                try {
                    ordersSnap = await db.collection("tables").doc(currentTableId).collection("orders").orderBy("timestamp").get();
                } catch (e) {
                    ordersSnap = await db.collection("tables").doc(currentTableId).collection("orders").get();
                }

                if (!ordersSnap.empty) {
                    ordersSnap.forEach(doc => {
                        let item = doc.data();
                        let amt = parseFloat(item.amount || item.price || item.totalAmount) || 0;
                        let title = item.action || item.menuName || item.name || item.details || "รายการอาหาร";
                        totalBillAmount += amt;
                        
                        let detailText = "";
                        if (item.details && item.details !== title) {
                             detailText = "<br><small class='text-muted'>" + item.details + "</small>";
                        }
                        
                        html += "<li class='d-flex justify-content-between align-items-start mb-2 pb-2 border-bottom'>" +
                                    "<div>" +
                                        "<span class='fw-bold'>" + title + "</span>" + detailText +
                                    "</div>" +
                                    "<span class='text-danger fw-bold text-nowrap'>" + amt.toLocaleString() + " บ.</span>" +
                                "</li>";
                    });
                }

                if (!html) {
                    html = "<li class='text-center text-danger'>ไม่พบรายการสั่งอาหารสำหรับโต๊ะนี้</li>";
                }

                document.getElementById('receiptItems').innerHTML = html;
                document.getElementById('subTotalTxt').innerText = totalBillAmount.toLocaleString() + " บาท";

                totalEarnedPoints = Math.floor(totalBillAmount / 100);
                document.getElementById('suggestedPoints').innerText = "แต้มรวมของบิลนี้: " + totalEarnedPoints + " แต้ม";
                
                renderMembersList(activeMembers, totalEarnedPoints);
                calculateNetTotal();

            } catch (error) {
                console.error("Error loading bill:", error);
                Swal.fire("ข้อผิดพลาด", "ไม่สามารถดึงข้อมูลบิลได้: " + error.message, "error");
            }
        }

        // --- 4. จัดการรายชื่อสมาชิกที่ได้แต้ม ---
        function renderMembersList(members, totalPoints) {
            let container = document.getElementById('membersList');
            if (!members || members.length === 0) {
                container.innerHTML = "<div class='alert alert-light text-center small text-muted border'>ไม่มีสมาชิกสะสมแต้มในโต๊ะนี้</div>";
                return;
            }

            let defaultPoints = Math.floor(totalPoints / members.length);
            let html = "";

            members.forEach((m) => {
                let name = m.displayName || m.name || m.phone || "สมาชิก";
                let img = m.pictureUrl || m.picture || "https://ui-avatars.com/api/?name=" + encodeURIComponent(name) + "&background=0D8ABC&color=fff";
                let uid = m.uid || m.phone || "";

                html += "<div class='d-flex align-items-center justify-content-between p-2 mb-2 bg-white rounded border'>" +
                            "<div class='d-flex align-items-center gap-2'>" +
                                "<img src='" + img + "' style='width: 35px; height: 35px; border-radius: 50%;'>" +
                                "<div class='lh-1'>" +
                                    "<div class='fw-bold' style='font-size: 14px;'>" + name + "</div>" +
                                    "<small class='text-muted' style='font-size: 11px;'>" + (m.phone || '') + "</small>" +
                                "</div>" +
                            "</div>" +
                            "<div class='d-flex align-items-center gap-1' style='width: 100px;'>" +
                                "<input type='number' class='form-control form-control-sm text-center fw-bold point-input' " +
                                       "data-uid='" + uid + "' value='" + defaultPoints + "' min='0' oninput='validatePoints()'>" +
                                "<span class='small text-muted'>แต้ม</span>" +
                            "</div>" +
                        "</div>";
            });
            container.innerHTML = html;
        }

        function validatePoints() {
            let inputs = document.querySelectorAll('.point-input');
            let sum = 0;
            inputs.forEach(inp => sum += parseInt(inp.value) || 0);

            if (sum > totalEarnedPoints) {
                Swal.fire('แจ้งเตือน', "คุณไม่สามารถแจกแต้มเกินยอดรวม (" + totalEarnedPoints + " แต้ม) ได้ครับ", 'warning');
            }
        }

        // --- 5. คำนวณเงินและเงินทอน ---
        function calculateNetTotal() {
            let discVal = parseFloat(document.getElementById('discountVal').value) || 0;
            let discType = document.getElementById('discountType').value;
            let net = totalBillAmount;

            if (discType === "%") {
                net = totalBillAmount - (totalBillAmount * (discVal / 100));
            } else {
                net = totalBillAmount - discVal;
            }

            net = net < 0 ? 0 : net;
            document.getElementById('netTotalTxt').innerText = net.toLocaleString() + " บาท";
            document.getElementById('netTotalTxt').dataset.net = net;
            calculateChange();
        }

        function toggleCashInput() {
            let payType = document.getElementById('payType').value;
            document.getElementById('cashInputDiv').style.display = (payType === "เงินสด") ? "block" : "none";
            calculateChange();
        }

        function calculateChange() {
            let payType = document.getElementById('payType').value;
            if (payType !== "เงินสด") return;

            let net = parseFloat(document.getElementById('netTotalTxt').dataset.net) || 0;
            let rec = parseFloat(document.getElementById('cashReceived').value) || 0;
            let change = rec - net;
            let display = document.getElementById('changeDisplay');

            if (change >= 0) {
                display.innerText = "เงินทอน: " + change.toLocaleString() + " บาท";
                display.className = "text-center fw-bold text-success fs-5";
            } else {
                display.innerText = "เงินขาด: " + Math.abs(change).toLocaleString() + " บาท";
                display.className = "text-center fw-bold text-danger fs-5";
            }
        }

        // --- 6. ยืนยันการชำระเงิน ---
        async function confirmPayment() {
            let net = parseFloat(document.getElementById('netTotalTxt').dataset.net) || 0;
            let payType = document.getElementById('payType').value;
            let rec = (payType === "เงินสด") ? (parseFloat(document.getElementById('cashReceived').value) || 0) : net;
            
            if (payType === "เงินสด" && rec < net) {
                return Swal.fire("แจ้งเตือน", "จำนวนเงินสดที่รับมาไม่เพียงพอครับ", "warning");
            }

            let inputs = document.querySelectorAll('.point-input');
            let sumPoints = 0;
            inputs.forEach(inp => sumPoints += parseInt(inp.value) || 0);
            if (sumPoints > totalEarnedPoints) {
                return Swal.fire("แจ้งเตือน", "แต้มรวมที่แจกเกินโควต้าของบิลนี้", "warning");
            }

            document.getElementById('btnConfirm').disabled = true;
            document.getElementById('btnConfirm').innerText = "กำลังบันทึกข้อมูล...";

            try {
                const batch = db.batch();
                let discVal = parseFloat(document.getElementById('discountVal').value) || 0;
                let discTypeVal = document.getElementById('discountType').value;
                let discText = "ไม่มี";
                if (discVal > 0) {
                    discText = discVal + " " + discTypeVal;
                }

                // 1. บันทึกประวัติ
                const checkoutRef = db.collection("checkouts").doc();
                batch.set(checkoutRef, {
                    tableNo: currentTableId,
                    total: totalBillAmount,
                    discount: discText,
                    netTotal: net,
                    payType: payType,
                    receive: rec,
                    change: rec - net,
                    shiftId: "ระบบกะอัตโนมัติ",
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                // 2. ลบออเดอร์ในโต๊ะ
                const ordersSnap = await db.collection("tables").doc(currentTableId).collection("orders").get();
                ordersSnap.forEach(doc => batch.delete(doc.ref));

                // 3. รีเซ็ตโต๊ะ
                const tableRef = db.collection("tables").doc(currentTableId);
                batch.update(tableRef, {
                    status: "ว่าง",
                    activeMembers: [],
                    adults: 0,
                    children: 0,
                    totalPeople: 0,
                    packagePrice: 0
                });

                // 4. บันทึกแต้ม
                inputs.forEach(inp => {
                    let uid = inp.getAttribute('data-uid');
                    let pts = parseInt(inp.value) || 0;
                    if (uid && pts > 0) {
                        const memberRef = db.collection("members").doc(uid);
                        batch.set(memberRef, { points: firebase.firestore.FieldValue.increment(pts) }, { merge: true });
                    }
                });

                await batch.commit();

                Swal.fire({
                    title: "ชำระเงินสำเร็จ!",
                    text: "ปิดโต๊ะเรียบร้อยแล้ว",
                    icon: "success",
                    timer: 2000,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = "dashboard.html";
                });

            } catch (error) {
                console.error("Payment error:", error);
                Swal.fire("เกิดข้อผิดพลาด", "ไม่สามารถบันทึกการชำระเงินได้", "error");
                document.getElementById('btnConfirm').disabled = false;
                document.getElementById('btnConfirm').innerText = "✅ ยืนยันรับชำระเงิน และปิดโต๊ะ";
            }
        }
    </script>
</body>
</html>
