<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบบห้องครัว - จัดเตรียมอาหารและอุปกรณ์</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Firebase SDK (Firestore) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Sarabun', sans-serif; background: #2f3542; color: white; padding: 20px; margin: 0; }
        h2 { text-align: center; color: #ff4757; margin-top: 0; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; justify-content: center; }
        .tab-btn { background: #dfe4ea; color: #2f3542; border: none; padding: 12px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; flex: 1; max-width: 250px;}
        .tab-btn.active { background: #ff4757; color: white; }
        .tab-btn-done.active { background: #2ed573; color: white; }

        .date-filter-box { display: none; text-align: center; margin-bottom: 20px; background: #57606f; padding: 10px; border-radius: 5px; }
        .date-filter-box label { font-weight: bold; margin-right: 10px; }
        .date-filter-box input { padding: 6px; font-size: 16px; border-radius: 4px; border: none; cursor: pointer; }

        .order-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; margin-top: 10px; }
        .order-card { background: #dfe4ea; color: #333; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border-left: 6px solid #ffa502; display: flex; flex-direction: column; }
        .order-card.completed { opacity: 0.8; border-left-color: #747d8c !important; }
        .order-card h3 { margin-top: 0; color: #2f3542; border-bottom: 2px solid #ced6e0; padding-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
        
        .action-badge { font-size: 12px; color: white; padding: 3px 8px; border-radius: 4px; }
        .badge-open { background: #3742fa; }
        .badge-add-cust { background: #8e44ad; }
        .badge-stove { background: #e84118; }
        .badge-food { background: #2ed573; color: #2f3542; }
        
        .edit-qty-box { display: flex; align-items: center; justify-content: space-between; background: white; padding: 8px 10px; border-radius: 5px; margin-bottom: 8px; border: 1px solid #ced6e0; }
        .edit-qty-box span.item-name { font-weight: bold; color: #2f3542; flex: 1; }
        
        .refresh-box { text-align: right; margin-bottom: 10px; }
        .btn-refresh { background: #1e90ff; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; }

        .qty-wrapper { display: flex; align-items: center; justify-content: flex-end; min-width: 140px; }
        .qty-controls { display: flex; align-items: center; margin-right: 8px; background: white; border-radius: 4px; border: 1px solid #ced6e0; overflow: hidden; }
        .qty-btn { background: #f1f2f6; border: none; width: 26px; height: 26px; font-size: 16px; cursor: pointer; color: #2f3542; font-weight: bold; display: flex; justify-content: center; align-items: center; transition: 0.2s; padding: 0; }
        .qty-btn:hover { background: #dfe4ea; }
        .qty-input { width: 32px; height: 26px; text-align: center; border: none; border-left: 1px solid #ced6e0; border-right: 1px solid #ced6e0; font-size: 14px; font-weight: bold; color: #d63031; -moz-appearance: textfield; outline: none; padding: 0; margin: 0; }
        .qty-input::-webkit-outer-spin-button, .qty-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>

    <h2>🍳 ระบบห้องครัว</h2>

    <div class="tabs">
        <button id="btn-pending" class="tab-btn active" onclick="switchTab('pending')">🔥 รายการรอทำ</button>
        <button id="btn-completed" class="tab-btn tab-btn-done" onclick="switchTab('completed')">✅ ทำเสร็จแล้ว (ย้อนหลัง)</button>
    </div>

    <div id="date-filter-container" class="date-filter-box">
        <label>📅 เลือกวันที่ดูประวัติ: </label>
        <input type="date" id="history-date" onchange="loadCompletedOrders()">
    </div>
    
    <div class="refresh-box">
        <button type="button" class="btn-refresh" onclick="refreshCurrentTab()">🔄 รีเฟรชข้อมูล</button>
    </div>

    <div id="kitchenContainer" class="order-container">
        <p style="text-align:center; grid-column: 1/-1; color: #ced6e0;">กำลังโหลดออเดอร์...</p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCcSSovygMSoS6PYX_sS8T-7i62qvw_Agk",
            authDomain: "buffet-system-9b165.firebaseapp.com",
            projectId: "buffet-system-9b165",
            storageBucket: "buffet-system-9b165.firebasestorage.app",
            messagingSenderId: "144497251618",
            appId: "1:144497251618:web:cf9e2984e4c6a11a3dc17b",
            measurementId: "G-82JK3EL1HL"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentTab = 'pending';
        let unsubscribes = [];

        window.onload = function() {
            let today = new Date();
            let dd = String(today.getDate()).padStart(2, '0');
            let mm = String(today.getMonth() + 1).padStart(2, '0');
            let yyyy = today.getFullYear();
            document.getElementById('history-date').value = yyyy + "-" + mm + "-" + dd;
            loadKitchenOrders();
        };

        function switchTab(tabName) {
            currentTab = tabName;
            document.getElementById('btn-pending').classList.remove('active');
            document.getElementById('btn-completed').classList.remove('active');
            clearListeners();

            if (tabName === 'pending') {
                document.getElementById('btn-pending').classList.add('active');
                document.getElementById('date-filter-container').style.display = 'none';
                loadKitchenOrders();
            } else {
                document.getElementById('btn-completed').classList.add('active');
                document.getElementById('date-filter-container').style.display = 'block';
                loadCompletedOrders();
            }
        }

        function refreshCurrentTab() {
            clearListeners();
            if (currentTab === 'pending') loadKitchenOrders();
            else loadCompletedOrders();
        }

        function clearListeners() {
            unsubscribes.forEach(function(unsub) { unsub(); });
            unsubscribes = [];
        }

        function parseOrderDetails(detailsStr) {
            if (!detailsStr) return [];
            let items = String(detailsStr).split('\n');
            let result = [];
            for(let i=0; i<items.length; i++) {
                let cleanItem = items[i].trim();
                if(cleanItem === "") continue;
                let match = cleanItem.match(/(.+?)\s*x\s*(\d+)/) || cleanItem.match(/(.+?)\s*\(x(\d+)\)/);
                if (match) {
                    result.push({ name: match[1].trim(), qty: parseInt(match[2]) });
                } else {
                    result.push({ name: cleanItem, qty: 1 });
                }
            }
            return result;
        }

        async function loadKitchenOrders() {
            let container = document.getElementById('kitchenContainer');
            container.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #ced6e0;'>กำลังโหลดออเดอร์ล่าสุด...</p>";
            let allPendingOrders = [];
            
            try {
                const tablesSnapshot = await db.collection("tables").get();
                if (tablesSnapshot.empty) {
                    container.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #ced6e0;'>🎉 ไม่มีโต๊ะที่เปิดบริการในขณะนี้</p>";
                    return;
                }

                tablesSnapshot.forEach(function(doc) {
                    let tableNo = doc.id;
                    let tData = doc.data() || {};
                    
                    let adult = parseInt(tData.adults || tData.adultCount || tData.adult || 0) || 0;
                    let child = parseInt(tData.children || tData.childCount || tData.child || 0) || 0;
                    let totalP = parseInt(tData.totalPeople || tData.people || tData.pax || 0) || 0;
                    
                    let totalPeople = 0;
                    if (totalP > 0) {
                        totalPeople = totalP;
                    } else if ((adult + child) > 0) {
                        totalPeople = adult + child;
                    }

                    let unsub = db.collection("tables").doc(tableNo).collection("orders")
                        .where("kitchenStatus", "==", "เตรียม")
                        .onSnapshot(function(snapshot) {
                            allPendingOrders = allPendingOrders.filter(function(o) { return o.tableNo !== tableNo; });
                            snapshot.forEach(function(orderDoc) {
                                let order = orderDoc.data();
                                order.id = orderDoc.id;
                                order.tableNo = tableNo;
                                order.totalPeople = totalPeople;
                                allPendingOrders.push(order);
                            });
                            renderPendingOrders(allPendingOrders, container);
                        });
                    unsubscribes.push(unsub);
                });

            } catch (err) {
                console.error("Error loading kitchen orders:", err);
                container.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #ff4757;'>เกิดข้อผิดพลาด: " + err.message + "</p>";
            }
        }

        function renderPendingOrders(orders, container) {
            if (orders.length === 0) {
                container.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #ced6e0;'>🎉 ไม่มีออเดอร์ค้างทำในขณะนี้</p>";
                return;
            }

            orders.sort(function(a, b) {
                let timeA = a.timestamp ? a.timestamp.toMillis() : 0;
                let timeB = b.timestamp ? b.timestamp.toMillis() : 0;
                return timeA - timeB;
            });

            let html = "";
            for (let i = 0; i < orders.length; i++) {
                let order = orders[i];
                let actionType = order.action || "สั่งอาหาร";
                
                let isCustomerAction = actionType.includes("เปิดโต๊ะ") || actionType.includes("เพิ่มลูกค้า");

                let badgeClass = "badge-food";
                let borderColor = "#2ed573";
                if (actionType.includes("เปิดโต๊ะ")) {
                    badgeClass = "badge-open";
                    borderColor = "#3742fa";
                } else if (actionType.includes("เพิ่มลูกค้า")) {
                    badgeClass = "badge-add-cust";
                    borderColor = "#8e44ad";
                } else if (actionType.includes("เตา") || actionType.includes("ซุป")) {
                    badgeClass = "badge-stove";
                    borderColor = "#e84118";
                }
                
                let timeText = "กำลังบันทึกเวลา...";
                if (order.timestamp) {
                    timeText = order.timestamp.toDate().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + " น.";
                }

                let parsedItems = parseOrderDetails(order.details);
                let completedItems = order.completedItems || [];

                let itemsHtml = "";
                for (let idx = 0; idx < parsedItems.length; idx++) {
                    let item = parsedItems[idx];
                    let isDone = completedItems.includes(idx);
                    
                    let btnText = isCustomerAction ? "✔️ รับทราบ" : "✔️ เสร็จ";
                    let btnHtml = isDone 
                        ? "<span style='color: #27ae60; font-size: 13px; font-weight: bold; width: 65px; text-align: center;'>✅ เรียบร้อย</span>"
                        : "<button type='button' onclick=\"finishSingleItem(event, '" + order.tableNo + "', '" + order.id + "', " + idx + ", " + parsedItems.length + ")\" style='background: #2ed573; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; width: 70px;'>" + btnText + "</button>";
                    
                    let unit = (item.name.includes("ซุป") || item.name.includes("เตา") || isCustomerAction) ? "ที่" : "จาน";
                    let bgStyle = isDone ? "background: #f1f2f6; opacity: 0.7;" : "";
                    let textStyle = isDone ? "text-decoration: line-through; color: #747d8c;" : "";

                    let qtyHtml = "";
                    if (isDone) {
                        qtyHtml = isCustomerAction ? "" : "<span style='font-size: 15px; font-weight: bold; color: #747d8c; margin-right: 12px;'>" + item.qty + " " + unit + "</span>";
                    } else {
                        if (isCustomerAction) {
                            qtyHtml = "<span style='font-size: 13px; font-weight: bold; color: #8e44ad; margin-right: 12px;'>เตรียมอุปกรณ์</span>";
                        } else {
                            qtyHtml = "<div class='qty-controls'>" +
                                 "<button type='button' class='qty-btn' onclick=\"adjustQty('" + order.tableNo + "', '" + order.id + "', " + idx + ", -1)\">-</button>" +
                                 "<input type='number' class='qty-input' id='qty-" + order.id + "-" + idx + "' value='" + item.qty + "' onchange=\"manualUpdateQty('" + order.tableNo + "', '" + order.id + "', " + idx + ", this.value)\">" +
                                 "<button type='button' class='qty-btn' onclick=\"adjustQty('" + order.tableNo + "', '" + order.id + "', " + idx + ", 1)\">+</button>" +
                               "</div>" +
                               "<span style='font-size: 13px; font-weight: bold; color: #d63031; margin-right: 8px; min-width: 20px;'>" + unit + "</span>";
                        }
                    }

                    itemsHtml += "<div class='edit-qty-box' style='margin-bottom: 6px; padding: 6px 10px; " + bgStyle + "'>" +
                           "<span class='item-name' style='" + textStyle + "'>" + item.name + "</span>" +
                           "<div class='qty-wrapper'>" +
                               qtyHtml + btnHtml +
                           "</div>" +
                        "</div>";
                }

                let peopleText = "<span style='font-size: 14px; color: #747d8c; font-weight: normal; margin-left: 6px;'>(ไม่ได้ระบุจำนวน)</span>";
                if(order.totalPeople > 0) {
                    peopleText = "<span style='font-size: 14px; color: #747d8c; font-weight: normal; margin-left: 6px;'>(ลูกค้า " + order.totalPeople + " ท่าน)</span>";
                }

                html += "<div class='order-card' style='border-left-color: " + borderColor + ";'>" +
                        "<h3>" +
                            "<div>โต๊ะ: <span style='color:#d63031; font-size: 24px;'>" + order.tableNo + "</span>" + peopleText + "</div>" +
                            "<span class='action-badge " + badgeClass + "'>" + actionType + "</span>" +
                        "</h3>" +
                        "<div style='font-size: 13px; color: #57606f; margin-bottom: 8px;'>⏱ เวลา: " + timeText + "</div>" +
                        "<div style='margin-bottom:5px;'>" + itemsHtml + "</div>" +
                    "</div>";
            }
            container.innerHTML = html;
        }

        async function adjustQty(tableNo, orderId, itemIndex, delta) {
            let inputId = "qty-" + orderId + "-" + itemIndex;
            let inputElement = document.getElementById(inputId);
            if (!inputElement) return;
            
            let currentQty = parseInt(inputElement.value);
            let newQty = currentQty + delta;
            if (newQty <= 0) return; 
            
            inputElement.value = newQty;
            await saveNewQtyToDB(tableNo, orderId, itemIndex, newQty);
        }

        async function manualUpdateQty(tableNo, orderId, itemIndex, val) {
            let newQty = parseInt(val);
            if (isNaN(newQty) || newQty <= 0) {
                alert("กรุณาใส่จำนวนที่ถูกต้อง (ต้องมากกว่า 0)");
                return;
            }
            await saveNewQtyToDB(tableNo, orderId, itemIndex, newQty);
        }

        async function saveNewQtyToDB(tableNo, orderId, itemIndex, newQty) {
            try {
                const orderRef = db.collection("tables").doc(String(tableNo)).collection("orders").doc(orderId);
                const doc = await orderRef.get();
                if (doc.exists) {
                    let data = doc.data();
                    let detailLines = data.details ? String(data.details).split('\n') : [];
                    
                    if (detailLines[itemIndex]) {
                        let match = detailLines[itemIndex].match(/(.+?)\s*x\s*(\d+)/) || detailLines[itemIndex].match(/(.+?)\s*\(x(\d+)\)/);
                        if (match) {
                            detailLines[itemIndex] = match[1].trim() + " x " + newQty;
                        } else {
                            detailLines[itemIndex] = detailLines[itemIndex].trim() + " x " + newQty;
                        }
                        await orderRef.update({ details: detailLines.join('\n') });
                    }
                }
            } catch (err) {
                console.error("เกิดข้อผิดพลาดในการอัปเดตจำนวน: ", err);
            }
        }

        async function finishSingleItem(event, tableNo, orderId, itemIndex, totalItems) {
            let btn = event.target;
            btn.disabled = true;
            btn.innerText = "⏳...";

            try {
                const orderRef = db.collection("tables").doc(String(tableNo)).collection("orders").doc(orderId);
                const doc = await orderRef.get();
                
                if (doc.exists) {
                    let data = doc.data();
                    let completed = data.completedItems || [];
                    
                    if (!completed.includes(itemIndex)) {
                        completed.push(itemIndex);
                    }

                    let updateData = { completedItems: completed };

                    if (completed.length >= totalItems) {
                        updateData.kitchenStatus = "เสร็จ"; 
                    }

                    await orderRef.update(updateData);
                }
            } catch (err) {
                alert("เกิดข้อผิดพลาด: " + err.message);
                btn.disabled = false;
                btn.innerText = "✔️ เสร็จ";
            }
        }

        async function loadCompletedOrders() {
            let container = document.getElementById('kitchenContainer');
            let selectedDateStr = document.getElementById('history-date').value; 
            container.innerHTML = "<p style='text-align:center; grid-column: 1/-1; color: #ced6e0;'>กำลังโหลดข้อมูลออเดอร์ที่เสร็จแล้ว...</p>";
            let allCompletedOrders = [];
            
            try {
                let startDate = new Date(selectedDateStr + "T00:00:00");
                let endDate = new Date(selectedDateStr + "T23:59:59");
                const tablesSnapshot = await db.collection("tables").get();
                
                for (let i = 0; i < tablesSnapshot.docs.length; i++) {
                    let doc = tablesSnapshot.docs[i];
                    let tableNo = doc.id;
                    const ordersSnapshot = await db.collection("tables").doc(tableNo).collection("orders")
                        .where("kitchenStatus", "==", "เสร็จ")
                        .where("timestamp", ">=", startDate)
                        .where("timestamp", "<=", endDate)
                        .get();
                        
                    ordersSnapshot.forEach(function(orderDoc) {
                        let order = orderDoc.data();
                        order.id = orderDoc.id;
                        order.tableNo = tableNo;
                        allCompletedOrders.push(order);
                    });
                }

                if (allCompletedOrders.length === 0) {
                    container.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #ced6e0;'>ไม่มีประวัติการทำออเดอร์ในวันที่ " + selectedDateStr + "</p>";
                    return;
                }

                allCompletedOrders.sort(function(a, b) { return b.timestamp.toMillis() - a.timestamp.toMillis(); }); 
                let html = "";
                for (let i = 0; i < allCompletedOrders.length; i++) {
                    let order = allCompletedOrders[i];
                    let actionType = order.action || "สั่งอาหาร";
                    let timeText = order.timestamp ? order.timestamp.toDate().toLocaleTimeString('th-TH') : "";
                    
                    let detailLines = order.details ? String(order.details).split('\n') : [];
                    let detailTextArray = [];
                    for(let j=0; j<detailLines.length; j++) {
                        if(detailLines[j].trim() !== "") {
                            detailTextArray.push(detailLines[j] + " <span style='color: #27ae60; font-size: 13px; margin-left: 6px; font-weight: normal;'>✅ ทำเสร็จแล้ว</span>");
                        }
                    }
                    let detailText = detailTextArray.join('<br>');

                    html += "<div class='order-card completed'>" +
                            "<h3>" +
                                "<div>โต๊ะ: " + order.tableNo + "</div>" +
                                "<span class='action-badge' style='background:#747d8c;'>" + actionType + "</span>" +
                            "</h3>" +
                            "<div style='font-size: 13px; color: #57606f; margin-bottom: 8px;'>⏱ " + timeText + "</div>" +
                            "<div style='margin-bottom:15px; font-weight:bold; color: #2f3542; line-height: 1.8;'>" + detailText + "</div>" +
                        "</div>";
                }
                container.innerHTML = html;

            } catch (err) {
                console.error("Error loading completed orders:", err);
                container.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #ff4757;'>เกิดข้อผิดพลาดในการโหลดประวัติ: " + err.message + "</p>";
            }
        }
    </script>
</body>
</html>
