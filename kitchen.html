<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบบห้องครัว - จัดเตรียมอาหารและอุปกรณ์</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        body { font-family: 'Sarabun', sans-serif; background: #2f3542; color: white; padding: 20px; margin: 0; }
        h2 { text-align: center; color: #ff4757; margin-top: 0; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; justify-content: center; }
        .tab-btn { background: #dfe4ea; color: #2f3542; border: none; padding: 12px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; flex: 1; max-width: 250px;}
        .tab-btn.active { background: #ff4757; color: white; }
        .tab-btn-done.active { background: #2ed573; color: white; }

        /* กล่องเลือกวันที่ */
        .date-filter-box { display: none; text-align: center; margin-bottom: 20px; background: #57606f; padding: 10px; border-radius: 5px; }
        .date-filter-box label { font-weight: bold; margin-right: 10px; }
        .date-filter-box input { padding: 6px; font-size: 16px; border-radius: 4px; border: none; cursor: pointer; }

        .order-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; margin-top: 10px; }
        .order-card { background: #dfe4ea; color: #333; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border-left: 6px solid #ffa502; display: flex; flex-direction: column; }
        .order-card.completed { opacity: 0.8; border-left-color: #747d8c !important; }
        .order-card h3 { margin-top: 0; color: #2f3542; border-bottom: 2px solid #ced6e0; padding-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
        
        .action-badge { font-size: 12px; color: white; padding: 3px 8px; border-radius: 4px; }
        .badge-open { background: #3742fa; }
        .badge-stove { background: #e84118; }
        .badge-food { background: #2ed573; color: #2f3542; }
        .customer-count { font-size: 15px; color: #ff4757; font-weight: bold; margin-left: 8px; }
        .info-box { background: #ffeaa7; color: #d63031; padding: 10px; border-radius: 5px; font-weight: bold; margin-bottom: 12px; text-align: center; }
        
        .edit-qty-box { display: flex; align-items: center; justify-content: space-between; background: white; padding: 8px 10px; border-radius: 5px; margin-bottom: 8px; border: 1px solid #ced6e0; }
        .edit-qty-box span { font-weight: bold; color: #2f3542; }
        .edit-qty-box input { width: 60px; text-align: center; font-size: 16px; padding: 5px; border: 1px solid #747d8c; border-radius: 4px; font-weight: bold; }
        
        .btn-done { background: #2ed573; color: white; border: none; width: 100%; padding: 12px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: auto; font-size: 16px; transition: 0.3s; }
        .btn-done:hover { background: #26af5f; }
        .refresh-box { text-align: right; margin-bottom: 10px; }
        .btn-refresh { background: #1e90ff; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>🍳 ระบบห้องครัว</h2>

    <div class="tabs">
        <button id="btn-pending" class="tab-btn active" onclick="switchTab('pending')">🔥 รายการรอทำ</button>
        <button id="btn-completed" class="tab-btn tab-btn-done" onclick="switchTab('completed')">✅ ทำเสร็จแล้ว (ย้อนหลัง)</button>
    </div>

    <!-- กล่องสำหรับเลือกวันที่ -->
    <div id="date-filter-container" class="date-filter-box">
        <label>📅 เลือกวันที่ดูประวัติ: </label>
        <input type="date" id="history-date" onchange="loadCompletedOrders()">
    </div>
    
    <div class="refresh-box">
        <button type="button" class="btn-refresh" onclick="refreshCurrentTab()">🔄 รีเฟรชข้อมูล</button>
    </div>

    <div id="kitchenContainer" class="order-container">
        <p style="text-align:center; grid-column: 1/-1; color: #ced6e0;">กำลังโหลดออเดอร์...</p>
    </div>

    <script>
        // --- กำหนดค่า Firebase Config ของคุณตรงนี้ ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let currentTab = 'pending';
        let pendingListener = null;

        window.onload = function() {
            // ตั้งค่าวันที่เริ่มต้นเป็น "วันนี้"
            let today = new Date();
            let dd = String(today.getDate()).padStart(2, '0');
            let mm = String(today.getMonth() + 1).padStart(2, '0');
            let yyyy = today.getFullYear();
            document.getElementById('history-date').value = `${yyyy}-${mm}-${dd}`;

            loadKitchenOrders();
        };

        function switchTab(tabName) {
            currentTab = tabName;
            document.getElementById('btn-pending').classList.remove('active');
            document.getElementById('btn-completed').classList.remove('active');
            
            if (tabName === 'pending') {
                document.getElementById('btn-pending').classList.add('active');
                document.getElementById('date-filter-container').style.display = 'none';
                loadKitchenOrders();
            } else {
                document.getElementById('btn-completed').classList.add('active');
                document.getElementById('date-filter-container').style.display = 'block';
                // ยกเลิก Realtime listener ตอนเปลี่ยนไปดูประวัติ
                if (pendingListener) db.ref('orders').off('value', pendingListener);
                loadCompletedOrders();
            }
        }

        function refreshCurrentTab() {
            if (currentTab === 'pending') loadKitchenOrders();
            else loadCompletedOrders();
        }

        function parseOrderDetails(detailsStr) {
            if (!detailsStr) return [];
            let items = detailsStr.split(',');
            return items.map(item => {
                let cleanItem = item.trim();
                let match = cleanItem.match(/(.+?)\s*\(x(\d+)\)/);
                if (match) return { name: match[1].trim(), qty: parseInt(match[2]) };
                return { name: cleanItem, qty: 1 };
            }).filter(item => item.name !== "");
        }

        // --- โหลดรายการที่ "รอทำ" (Realtime) ---
        function loadKitchenOrders() {
            let container = document.getElementById('kitchenContainer');
            let ordersRef = db.ref('orders');

            // ลบ listener เก่าเพื่อป้องกันการฟังซ้ำ
            if (pendingListener) ordersRef.off('value', pendingListener);

            pendingListener = ordersRef.on('value', (snapshot) => {
                let orders = [];
                snapshot.forEach((childSnapshot) => {
                    let order = childSnapshot.val();
                    order.id = childSnapshot.key;
                    // คัดเฉพาะรายการที่ยังไม่เสร็จ (status !== 'เสร็จสิ้น')
                    if (order.status !== 'เสร็จสิ้น') {
                        orders.push(order);
                    }
                });

                if (orders.length === 0) {
                    container.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #ced6e0;'>🎉 ไม่มีออเดอร์ค้างทำในขณะนี้</p>";
                    return;
                }

                let html = "";
                orders.forEach(function(order) {
                    let actionType = order.action || "สั่งอาหาร";
                    let badgeClass = "badge-food";
                    if (actionType.includes("เปิดโต๊ะ")) badgeClass = "badge-open";
                    else if (actionType.includes("เตา") || actionType.includes("ซุป")) badgeClass = "badge-stove";

                    if (actionType.includes("สั่งอาหาร")) {
                        let parsedItems = parseOrderDetails(order.details);
                        let itemsHtml = parsedItems.map((item, idx) => `
                            <div class="edit-qty-box">
                                <span id="name-${order.id}-${idx}">${item.name}</span>
                                <div><input type="number" id="qty-${order.id}-${idx}" value="${item.qty}" min="0"> จาน</div>
                            </div>
                        `).join('');
                        
                        html += `<div class="order-card" style="border-left-color: #2ed573;">
                                    <h3>
                                        <div>โต๊ะ: ${order.tableNo} <span class="customer-count">(ลูกค้า ${order.pax} ท่าน)</span></div>
                                        <span class="action-badge ${badgeClass}">${actionType}</span>
                                    </h3>
                                    <div style="font-size: 13px; color: #57606f; margin-bottom: 8px;">⏱ ${order.time || ''}</div>
                                    <div style="margin-bottom:15px;">${itemsHtml}</div>
                                    <button type="button" class="btn-done" onclick="finishFoodOrder(event, '${order.id}', ${parsedItems.length})">✔️ ทำเสร็จแล้ว</button>
                                 </div>`;
                    } else {
                        let borderColor = actionType.includes("เปิดโต๊ะ") ? "#3742fa" : "#e84118";
                        html += `<div class="order-card" style="border-left-color: ${borderColor};">
                                    <h3>
                                        <div>โต๊ะ: ${order.tableNo} <span class="customer-count">(ลูกค้า ${order.pax} ท่าน)</span></div>
                                        <span class="action-badge ${badgeClass}">${actionType}</span>
                                    </h3>
                                    <div style="font-size: 13px; color: #57606f; margin-bottom: 8px;">⏱ ${order.time || ''}</div>
                                    <div class="info-box">${order.details || ''}</div>
                                    <button type="button" class="btn-done" onclick="finishSimpleOrder(event, '${order.id}')">✔️ เตรียมเรียบร้อย</button>
                                 </div>`;
                    }
                });
                container.innerHTML = html;
            });
        }

        // --- โหลดรายการที่ "ทำเสร็จแล้ว" (ตามวันที่เลือก) ---
        function loadCompletedOrders() {
            let container = document.getElementById('kitchenContainer');
            let selectedDate = document.getElementById('history-date').value;
            
            container.innerHTML = `<p style='text-align:center; grid-column: 1/-1; color: #ced6e0;'>กำลังโหลดข้อมูลของวันที่ ${selectedDate} ...</p>`;
            
            db.ref('orders').once('value', (snapshot) => {
                let orders = [];
                snapshot.forEach((childSnapshot) => {
                    let order = childSnapshot.val();
                    order.id = childSnapshot.key;
                    // คัดเฉพาะรายการที่ทำเสร็จแล้ว และ ตรงกับวันที่เลือก
                    if (order.status === 'เสร็จสิ้น' && (order.date === selectedDate || (order.time && order.time.includes(selectedDate)))) {
                        orders.push(order);
                    }
                });

                if (orders.length === 0) {
                    container.innerHTML = `<p style='grid-column: 1/-1; text-align: center; color: #ced6e0;'>ไม่มีประวัติการทำออเดอร์ในวันที่ ${selectedDate}</p>`;
                    return;
                }

                let html = "";
                orders.forEach(function(order) {
                    let actionType = order.action || "สั่งอาหาร";
                    html += `<div class="order-card completed">
                                <h3>
                                    <div>โต๊ะ: ${order.tableNo} <span class="customer-count">(ลูกค้า ${order.pax} ท่าน)</span></div>
                                    <span class="action-badge" style="background:#747d8c;">${actionType}</span>
                                </h3>
                                <div style="font-size: 13px; color: #57606f; margin-bottom: 8px;">⏱ ${order.time || ''}</div>
                                <div style="margin-bottom:15px; font-weight:bold; color: #2f3542;">${order.details || ''}</div>
                                <div style="text-align:center; color: #27ae60; font-weight:bold;">✅ ส่งออกไปแล้ว</div>
                             </div>`;
                });
                container.innerHTML = html;
            });
        }

        // --- กดเสร็จสิ้นออเดอร์อาหาร ---
        function finishFoodOrder(event, orderId, itemsCount) {
            let newDetails = [];
            for(let i = 0; i < itemsCount; i++) {
                let nameEl = document.getElementById(`name-${orderId}-${i}`);
                let qtyEl = document.getElementById(`qty-${orderId}-${i}`);
                if (nameEl && qtyEl) {
                    let name = nameEl.innerText;
                    let qty = parseInt(qtyEl.value);
                    if (qty > 0) newDetails.push(`${name} (x${qty})`);
                }
            }
            let updatedDetailsStr = newDetails.join(", ");
            if(!confirm("ยืนยันการจัดเตรียมรายการนี้เรียบร้อยแล้วใช่ไหม?")) return;

            let btn = event.target;
            btn.disabled = true;
            btn.innerText = "⏳ กำลังอัปเดต...";

            db.ref('orders/' + orderId).update({
                details: updatedDetailsStr,
                status: "เสร็จสิ้น"
            }).then(() => {
                // อัปเดตสำเร็จ ไม่ต้องดึงใหม่เพราะมี Realtime listener
            }).catch((err) => {
                alert("เกิดข้อผิดพลาด: " + err.message);
                btn.disabled = false;
                btn.innerText = "✔️ ทำเสร็จแล้ว";
            });
        }

        // --- กดเสร็จสิ้นออเดอร์ทั่วไป (เปิดโต๊ะ / เตา) ---
        function finishSimpleOrder(event, orderId) {
            if(!confirm("ยืนยันการเตรียมรายการนี้เรียบร้อยแล้วใช่ไหม?")) return;

            let btn = event.target;
            btn.disabled = true;
            btn.innerText = "⏳ กำลังอัปเดต...";

            db.ref('orders/' + orderId).update({
                status: "เสร็จสิ้น"
            }).then(() => {
                // อัปเดตสำเร็จ
            }).catch((err) => {
                alert("เกิดข้อผิดพลาด: " + err.message);
                btn.disabled = false;
                btn.innerText = "✔️ เตรียมเรียบร้อย";
            });
        }
    </script>
</body>
</html>
