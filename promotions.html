<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>โปรโมชั่นพิเศษ</title>
    <!-- โหลด LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- Firebase JS SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: #f7f9fc;
            color: #333;
            padding-bottom: 30px;
        }

        .header {
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            color: white;
            padding: 30px 20px 20px;
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
        }

        .promo-container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .promo-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }

        .promo-image {
            width: 100%;
            height: 180px;
            background-color: #eee;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .promo-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff3b30;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .promo-content {
            padding: 15px;
        }

        .promo-title {
            font-size: 18px;
            font-weight: 600;
            color: #ff7e5f;
            margin-bottom: 5px;
        }

        .promo-desc {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 10px;
            white-space: pre-line; /* รองรับการขึ้นบรรทัดใหม่ */
        }

        .promo-date {
            font-size: 12px;
            color: #999;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Loading Screen */
        #loading {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #f3f3f3; border-top: 4px solid #ff7e5f;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- หน้าจอโหลด -->
    <div id="loading">
        <div class="spinner"></div>
        <p style="margin-top: 15px; color: #666;">กำลังโหลดโปรโมชั่น...</p>
    </div>

    <!-- ส่วนหัว -->
    <div class="header">
        <h1>🎉 โปรโมชั่นพิเศษ</h1>
        <p>สิทธิพิเศษและส่วนลดสำหรับลูกค้าคนสำคัญ</p>
    </div>

    <!-- รายการโปรโมชั่น (ดึงจาก Firebase อัตโนมัติ) -->
    <div class="promo-container" id="promoContainer">
        <div class="text-center text-muted py-5">กำลังโหลดข้อมูลโปรโมชั่น...</div>
    </div>

    <script>
        // ⚠️ ตั้งค่า Firebase และ LIFF ID
        const firebaseConfig = {
            apiKey: "AIzaSyCcSSovygMSoS6PYX_sS8T-7i62qvw_Agk",
            authDomain: "buffet-system-9b165.firebaseapp.com",
            projectId: "buffet-system-9b165",
            storageBucket: "buffet-system-9b165.firebasestorage.app",
            messagingSenderId: "144497251618",
            appId: "1:144497251618:web:cf9e2984e4c6a11a3dc17b",
            measurementId: "G-82JK3EL1HL"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const LIFF_ID = "2011490016-ri1occKX"; 

        async function initializeApp() {
            try {
                // 1. เริ่มต้น LIFF
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                // 2. โหลดข้อมูลโปรโมชั่นจาก Firestore
                await loadDynamicPromotions();

            } catch (err) {
                console.error('Initialization Error:', err);
                document.getElementById('promoContainer').innerHTML = '<div class="text-center text-danger py-4">ไม่สามารถโหลดข้อมูลโปรโมชั่นได้</div>';
            } finally {
                // ซ่อนหน้าจอ Loading
                document.getElementById('loading').style.display = 'none';
            }
        }

        async function loadDynamicPromotions() {
            const docRef = db.collection("settings").doc("promotions");
            const docSnap = await docRef.get();
            
            const container = document.getElementById('promoContainer');

            if (!docSnap.exists || !docSnap.data().list || docSnap.data().list.length === 0) {
                container.innerHTML = '<div class="text-center text-muted py-5 bg-white rounded shadow-sm">ขณะนี้ยังไม่มีโปรโมชั่นพิเศษ</div>';
                return;
            }

            let promos = docSnap.data().list;
            // กรองเอาเฉพาะโปรโมชั่นที่เปิดใช้งาน (active: true หรือไม่ได้ปิด)
            let activePromos = promos.filter(p => p.active !== false);

            if (activePromos.length === 0) {
                container.innerHTML = '<div class="text-center text-muted py-5 bg-white rounded shadow-sm">ขณะนี้ยังไม่มีโปรโมชั่นพิเศษที่เปิดใช้งาน</div>';
                return;
            }

            let html = "";
            activePromos.forEach(p => {
                let imageUrl = p.imageUrl || "https://via.placeholder.com/400x200?text=No+Image";
                let badge = p.badge ? <div class="promo-badge">${p.badge}</div> : "";
                
                // 🛠️ แยกเขียนเงื่อนไขวันหมดเขตข้างนอก เพื่อป้องกัน Backtick ชนกัน
                let expiryHtml = p.expiry ? <div class="promo-date">📅 หมดเขต: ${p.expiry}</div> : "";

                html += `
                    <div class="promo-card">
                        <div class="promo-image" style="background-image: url('${imageUrl}');">
                            ${badge}
                        </div>
                        <div class="promo-content">
                            <h3 class="promo-title">${p.title || "โปรโมชั่นพิเศษ"}</h3>
                            <p class="promo-desc">${p.description || ""}</p>
                            ${expiryHtml}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // เริ่มการทำงานเมื่อเปิดหน้าเว็บ
        window.onload = initializeApp;
    </script>
</body>
</html>
