<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สั่งอาหาร - ลูกค้า</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding-bottom: 90px; }
        .header-bg { background-color: #e64a19; color: white; padding: 12px; border-radius: 0 0 15px 15px; }
        .menu-card { background: white; border-radius: 12px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow: hidden; }
        .menu-img { width: 100%; height: 110px; object-fit: cover; background-color: #eee; }
        .qty-btn { width: 28px; height: 28px; padding: 0; border-radius: 50%; font-weight: bold; line-height: 1; }
        .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; box-shadow: 0 -3px 10px rgba(0,0,0,0.1); padding: 12px 20px; z-index: 1000; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header-bg text-center mb-3">
        <h5 class="fw-bold m-0">🍽️ ยินดีต้อนรับ</h5>
        <small>สั่งอาหารง่ายๆ ผ่านมือถือของคุณ</small>
    </div>

    <div class="container">
        <!-- แสดงเลขโต๊ะ -->
        <div class="d-flex justify-content-between align-items-center mb-3 bg-white p-2 px-3 rounded-3 shadow-sm">
            <span class="fw-bold text-dark">📍 โต๊ะของคุณ: <span id="displayTableNo" class="text-danger fs-5">1</span></span>
            <span class="badge bg-success">เปิดโต๊ะเรียบร้อย</span>
        </div>

        <!-- รายการเมนูอาหาร -->
        <div class="row g-2" id="menuGrid">
            <!-- เมนูตัวอย่าง (จะเพิ่มขึ้นตามเมนูของร้าน) -->
            <div class="col-6 col-md-4 col-lg-3">
                <div class="menu-card p-2 text-center">
                    <div class="menu-img rounded mb-2 d-flex align-items-center justify-content-center text-muted fs-4">🥤</div>
                    <div class="fw-bold text-dark" style="font-size: 14px;">น้ำเปล่า</div>
                    <div class="text-danger small fw-bold mb-2">20 ฿</div>
                    <div class="d-flex justify-content-center align-items-center gap-2">
                        <button class="btn btn-outline-danger qty-btn" onclick="updateQty('water', -1)">-</button>
                        <span id="qty-water" class="fw-bold">0</span>
                        <button class="btn btn-success qty-btn" onclick="updateQty('water', 1)">+</button>
                    </div>
                </div>
            </div>

            <div class="col-6 col-md-4 col-lg-3">
                <div class="menu-card p-2 text-center">
                    <div class="menu-img rounded mb-2 d-flex align-items-center justify-content-center text-muted fs-4">🧊</div>
                    <div class="fw-bold text-dark" style="font-size: 14px;">น้ำแข็ง</div>
                    <div class="text-danger small fw-bold mb-2">15 ฿</div>
                    <div class="d-flex justify-content-center align-items-center gap-2">
                        <button class="btn btn-outline-danger qty-btn" onclick="updateQty('ice', -1)">-</button>
                        <span id="qty-ice" class="fw-bold">0</span>
                        <button class="btn btn-success qty-btn" onclick="updateQty('ice', 1)">+</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- แถบล่างสุด: ปุ่มส่งรายการ และ ปุ่มสรุปยอดบิล -->
    <div class="bottom-bar d-flex justify-content-between align-items-center">
        <div>
            <small class="text-muted d-block">รายการที่เลือก</small>
            <span id="cartCount" class="fw-bold text-primary fs-5">0</span> รายการ
        </div>
        <div class="d-flex gap-2">
            <!-- ปุ่มเปิดดูบิล -->
            <button class="btn btn-outline-primary fw-bold rounded-pill px-3" data-bs-toggle="modal" data-bs-target="#billModal" onclick="loadCustomerBill()">
                🧾 สรุปยอดบิล
            </button>
            <!-- ปุ่มส่งออเดอร์ -->
            <button class="btn btn-danger fw-bold rounded-pill px-4" onclick="submitOrder()">
                ส่งรายการ 🚀
            </button>
        </div>
    </div>

    <!-- Modal ป๊อบอัพแสดงสรุปยอดบิล -->
    <div class="modal fade" id="billModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow" style="border-radius: 15px;">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold text-dark">🧾 สรุปยอดบิล</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="billArea">
                        <div class="text-center my-3 text-muted">กำลังดึงข้อมูลบิล...</div>
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-secondary w-100 rounded-pill" data-bs-dismiss="modal">ปิด</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase JS SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCcSSovygMSoS6PYX_sS8T-7i62qvw_Agk",
            authDomain: "buffet-system-9b165.firebaseapp.com",
            projectId: "buffet-system-9b165",
            storageBucket: "buffet-system-9b165.firebasestorage.app",
            messagingSenderId: "144497251618",
            appId: "1:144497251618:web:cf9e2984e4c6a11a3dc17b",
            measurementId: "G-82JK3EL1HL"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let tableNo = "1";
        let cart = {};

        // ดึงเลขโต๊ะจาก URL หรือ LocalStorage
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            let tNo = urlParams.get('tableNo') || localStorage.getItem("customerTableNo") || "1";
            tableNo = tNo;
            localStorage.setItem("customerTableNo", tableNo);
            document.getElementById('displayTableNo').innerText = tableNo;
        };

        // จัดการบวก/ลบ จำนวนสินค้า
        function updateQty(itemId, change) {
            if (!cart[itemId]) cart[itemId] = 0;
            cart[itemId] += change;
            if (cart[itemId] < 0) cart[itemId] = 0;
            
            document.getElementById(`qty-${itemId}`).innerText = cart[itemId];
            
            let totalItems = Object.values(cart).reduce((a, b) => a + b, 0);
            document.getElementById('cartCount').innerText = totalItems;
        }

        // ฟังก์ชันสั่งอาหาร (ส่งเข้าฐานข้อมูล)
        async function submitOrder() {
            let totalItems = Object.values(cart).reduce((a, b) => a + b, 0);
            if (totalItems === 0) return alert("กรุณาเลือกรายการอาหารก่อนครับ");

            try {
                await db.collection("tables").doc(tableNo).collection("orders").add({
                    action: "สั่งอาหารเพิ่มเติม",
                    details: JSON.stringify(cart),
                    amount: 0,
                    kitchenStatus: "เตรียม",
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("ส่งรายการอาหารเข้าครัวเรียบร้อยแล้วครับ!");
                cart = {};
                document.querySelectorAll('[id^="qty-"]').forEach(el => el.innerText = '0');
                document.getElementById('cartCount').innerText = '0';
            } catch (err) {
                alert("เกิดข้อผิดพลาดในการส่งรายการ: " + err.message);
            }
        }

        // ฟังก์ชันโหลดข้อมูลบิลแสดงใน Modal (อิงโครงสร้าง tables/{tableNo}/orders)
        function loadCustomerBill() {
            let billArea = document.getElementById('billArea');
            billArea.innerHTML = "<div class='text-center my-3 text-muted'>กำลังโหลดยอดบิล...</div>";

            db.collection("tables").doc(tableNo).collection("orders")
                .orderBy("timestamp", "asc")
                .onSnapshot(function(snapshot) {
                    if (snapshot.empty) {
                        billArea.innerHTML = "<div class='alert alert-warning text-center m-0'>ยังไม่มีรายการสั่งอาหารในรอบนี้</div>";
                        return;
                    }

                    let totalAmount = 0;
                    let html = `<ul class="list-group list-group-flush mb-3">`;

                    snapshot.forEach(doc => {
                        let item = doc.data();
                        totalAmount += (item.amount || 0);

                        let kBadge = "";
                        if (item.kitchenStatus === "เตรียม") {
                            kBadge = '<span class="badge bg-warning text-dark ms-1">กำลังทำ</span>';
                        } else if (item.kitchenStatus === "เสร็จ") {
                            kBadge = '<span class="badge bg-success ms-1">เสิร์ฟแล้ว</span>';
                        }

                        let detailText = item.details ? item.details.replace(/\n/g, ', ') : "";

                        html += `<li class="list-group-item d-flex justify-content-between align-items-start px-0 py-2">
                                    <div>
                                        <div class="fw-bold text-dark" style="font-size: 14px;">${item.action} ${kBadge}</div>
                                        <small class="text-muted" style="font-size: 12px;">${detailText}</small>
                                    </div>
                                    <span class="fw-bold text-danger">${item.amount || 0} ฿</span>
                                 </li>`;
                    });

                    html += `</ul>
                             <div class="p-3 bg-light rounded-3 d-flex justify-content-between align-items-center" style="border: 1px dashed #dc3545;">
                                 <span class="fw-bold text-dark">ยอดสุทธิรวม:</span>
                                 <span class="fw-bold text-danger fs-4">${totalAmount.toLocaleString()} ฿</span>
                             </div>`;

                    billArea.innerHTML = html;
                }, function(err) {
                    billArea.innerHTML = `<div class='alert alert-danger'>เกิดข้อผิดพลาด: ${err.message}</div>`;
                });
        }
    </script>
</body>
</html>
