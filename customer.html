<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สั่งอาหาร - ลูกค้า</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding-bottom: 90px; }
        .header-bg { background-color: #e64a19; color: white; padding: 12px; border-radius: 0 0 15px 15px; }
        
        .category-scroll {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            gap: 8px;
            padding-bottom: 8px;
            scrollbar-width: none;
        }
        .category-scroll::-webkit-scrollbar { display: none; }
        
        .cat-btn {
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
        }

        .menu-card { background: white; border-radius: 12px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow: hidden; }
        .menu-img { width: 100%; height: 110px; object-fit: cover; background-color: #eee; }
        .qty-btn { width: 28px; height: 28px; padding: 0; border-radius: 50%; font-weight: bold; line-height: 1; }
        .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; box-shadow: 0 -3px 10px rgba(0,0,0,0.1); padding: 12px 20px; z-index: 1000; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header-bg text-center mb-3">
        <h5 class="fw-bold m-0">🍽️ ยินดีต้อนรับ</h5>
        <small>สั่งอาหารง่ายๆ ผ่านมือถือของคุณ</small>
    </div>

    <div class="container">
        <!-- แถบแสดงเลขโต๊ะ + ปุ่มเปลี่ยนโต๊ะ -->
        <div class="d-flex justify-content-between align-items-center mb-3 bg-white p-2 px-3 rounded-3 shadow-sm">
            <div>
                <span class="fw-bold text-dark">📍 โต๊ะของคุณ: <span id="displayTableNo" class="text-danger fs-5">?</span></span>
                <small id="displayPackage" class="d-block text-muted" style="font-size: 12px;"></small>
            </div>
            <button class="btn btn-sm btn-outline-secondary rounded-pill px-3" onclick="openTableSelectModal()">
                ✏️ เปลี่ยนโต๊ะ
            </button>
        </div>

        <!-- 📌 แถบแยกหมวดหมู่ (Category Tabs) -->
        <div class="category-scroll mb-3" id="categoryContainer" style="display: none;">
        </div>

        <!-- 📌 พื้นที่แสดงรายการอาหาร -->
        <div class="row g-2" id="menuGrid">
            <div class="text-center w-100 mt-5 text-muted">
                <h5>กรุณาระบุหมายเลขโต๊ะ</h5>
                <p>เพื่อดูเมนูอาหารและเริ่มสั่งอาหารครับ 🍽️</p>
            </div>
        </div>
    </div>

    <!-- แถบล่างสุด: ซ่อนไว้ก่อนจนกว่าจะเลือกโต๊ะ -->
    <div id="bottomBar" class="bottom-bar justify-content-between align-items-center" style="display: none;">
        <div>
            <small class="text-muted d-block">รายการที่เลือก</small>
            <span id="cartCount" class="fw-bold text-primary fs-5">0</span> รายการ
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-primary fw-bold rounded-pill px-3" data-bs-toggle="modal" data-bs-target="#billModal" onclick="loadCustomerBill()">
                🧾 สรุปยอดบิล
            </button>
            <button class="btn btn-danger fw-bold rounded-pill px-4" onclick="submitOrder()">
                ส่งรายการ 🚀
            </button>
        </div>
    </div>

    <!-- 📌 Modal เลือก/เปลี่ยนโต๊ะ -->
    <div class="modal fade" id="selectTableModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-0 shadow" style="border-radius: 15px;">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold text-dark">📍 ระบุหมายเลขโต๊ะ</h5>
                    <button type="button" class="btn-close d-none" id="closeTableModalBtn" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <p class="text-muted small mb-2">เลือกโต๊ะที่พนักงานเปิดให้คุณแล้ว</p>
                    
                    <select id="inputTableNo" class="form-select form-select-lg text-center fs-6 fw-bold mb-3 shadow-sm">
                        <option value="" disabled selected>กำลังโหลดโต๊ะ...</option>
                    </select>

                    <button class="btn btn-danger w-100 fw-bold rounded-pill" onclick="saveTableNo()">ตกลง</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal ป๊อบอัพแสดงสรุปยอดบิล -->
    <div class="modal fade" id="billModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow" style="border-radius: 15px;">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold text-dark">🧾 สรุปยอดบิล</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="billArea">
                        <div class="text-center my-3 text-muted">กำลังดึงข้อมูลบิล...</div>
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-secondary w-100 rounded-pill" data-bs-dismiss="modal">ปิด</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase JS SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCcSSovygMSoS6PYX_sS8T-7i62qvw_Agk",
            authDomain: "buffet-system-9b165.firebaseapp.com",
            projectId: "buffet-system-9b165",
            storageBucket: "buffet-system-9b165.firebasestorage.app",
            messagingSenderId: "144497251618",
            appId: "1:144497251618:web:cf9e2984e4c6a11a3dc17b",
            measurementId: "G-82JK3EL1HL"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let tableNo = "";
        let currentPackage = "";
        let cart = {}; 
        let allMenuItems = []; 
        let selectedCategory = 'all';

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            let tNo = urlParams.get('tableNo');
            
            if (!tNo) {
                openTableSelectModal();
            } else {
                tableNo = tNo;
                activateSystem();
            }
        };

        function openTableSelectModal() {
            let modalEl = document.getElementById('selectTableModal');
            let selectModal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
            selectModal.show();
            loadOccupiedTables();
        }

        // 📌 1. ดึงเฉพาะโต๊ะที่มีสถานะ "ไม่ว่าง" (ที่พนักงานเปิดโต๊ะไว้แล้ว)
        async function loadOccupiedTables() {
            let select = document.getElementById('inputTableNo');
            select.innerHTML = '<option value="">กำลังโหลดโต๊ะ...</option>';
            
            try {
                const snapshot = await db.collection("tables").get();
                let optionsHtml = '<option value="" disabled selected>-- กรุณาเลือกโต๊ะของคุณ --</option>';
                let hasOccupiedTable = false;

                snapshot.forEach(doc => {
                    let data = doc.data();
                    let status = data.status || "";
                    
                    if (status === "ไม่ว่าง" || status === "occupied" || status === "busy") {
                        let pkgText = "";
                        if (data.package) {
                            pkgText = " (" + data.package + ")";
                        } else if (data.packageName) {
                            pkgText = " (" + data.packageName + ")";
                        }
                        optionsHtml += '<option value="' + doc.id + '">โต๊ะ ' + doc.id + pkgText + '</option>';
                        hasOccupiedTable = true;
                    }
                });

                if (!hasOccupiedTable) {
                    optionsHtml = '<option value="" disabled selected>ยังไม่มีโต๊ะเปิด (โปรดแจ้งพนักงาน)</option>';
                }

                select.innerHTML = optionsHtml;
            } catch (err) {
                select.innerHTML = '<option value="" disabled>โหลดข้อมูลผิดพลาด</option>';
                console.error("Error loading tables:", err);
            }
        }

        function saveTableNo() {
            let selectVal = document.getElementById('inputTableNo').value;
            if (!selectVal) return alert("กรุณาเลือกหมายเลขโต๊ะจากรายการครับ");
            
            tableNo = selectVal;
            cart = {};
            document.getElementById('cartCount').innerText = '0';

            let modalEl = document.getElementById('selectTableModal');
            let modal = bootstrap.Modal.getInstance(modalEl);
            if (modal) modal.hide();

            activateSystem();
        }

        async function activateSystem() {
            document.getElementById('displayTableNo').innerText = tableNo;
            document.getElementById('closeTableModalBtn').classList.remove('d-none');
            document.getElementById('bottomBar').style.display = 'flex';
            document.getElementById('categoryContainer').style.display = 'flex';
            document.getElementById('menuGrid').innerHTML = "<div class='text-center w-100 my-4 text-muted'>กำลังโหลดข้อมูลแพ็กเกจและเมนู...</div>";

            try {
                const tableDoc = await db.collection("tables").doc(tableNo).get();
                if (tableDoc.exists) {
                    let tData = tableDoc.data();
                    currentPackage = tData.package || tData.packageName || "";
                    
                    if (currentPackage) {
                        document.getElementById('displayPackage').innerText = "แพ็กเกจ: " + currentPackage;
                    } else {
                        document.getElementById('displayPackage').innerText = '';
                    }
                }

                loadMenu();
            } catch (err) {
                console.error("Error fetching table package:", err);
                loadMenu();
            }
        }

        // 📌 2. ดึงข้อมูลเมนู + กรองแพ็กเกจราคาอย่างเข้มงวด
        async function loadMenu() {
            const menuGrid = document.getElementById('menuGrid');
            try {
                const snapshot = await db.collection("menu").get(); 
                
                if (snapshot.empty) {
                    menuGrid.innerHTML = "<div class='alert alert-warning w-100 text-center'>ไม่มีรายการเมนูในระบบ</div>";
                    return;
                }

                allMenuItems = [];
                let categoriesSet = new Set();

                // สกัดตัวเลขราคาจากแพ็กเกจของโต๊ะ (เช่น ได้ 119 จาก "ชาบูหมูกระทะ (119)")
                let tablePrice = 0;
                if (currentPackage) {
                    let match = String(currentPackage).match(/\d+/);
                    if (match) tablePrice = parseInt(match[0]);
                }

                snapshot.forEach(doc => {
                    let item = doc.data();
                    item.id = doc.id;
                    
                    let itemPkg = item.package || item.packageName || item.packages || item.tier || "";
                    let isMatch = false;

                    if (tablePrice > 0) {
                        let itemPrices = [];

                        if (Array.isArray(itemPkg)) {
                            itemPrices = itemPkg.map(p => {
                                let m = String(p).match(/\d+/);
                                return m ? parseInt(m[0]) : null;
                            }).filter(p => p !== null);
                        } else if (itemPkg !== "" && itemPkg !== null && itemPkg !== undefined) {
                            let match = String(itemPkg).match(/\d+/);
                            if (match) itemPrices.push(parseInt(match[0]));
                        }

                        if (itemPrices.length > 0) {
                            // แสดงเฉพาะเมนูที่มีราคาแพ็กเกจ <= ราคาแพ็กเกจของโต๊ะ (159 จะไม่แสดงในโต๊ะ 119)
                            isMatch = itemPrices.some(p => p <= tablePrice);
                        } else {
                            // เมนูกลาง (ไม่ได้ใส่แพ็กเกจ) แสดงผลให้ทุกโต๊ะ
                            isMatch = true; 
                        }
                    } else {
                        isMatch = true;
                    }

                    if (isMatch) {
                        allMenuItems.push(item);
                        if (item.category) {
                            categoriesSet.add(item.category);
                        }
                    }
                });

                if (allMenuItems.length === 0) {
                    menuGrid.innerHTML = "<div class='alert alert-warning w-100 text-center'>ไม่มีรายการอาหารสำหรับแพ็กเกจ " + (currentPackage || "") + "</div>";
                    return;
                }

                renderCategories(Array.from(categoriesSet));
                renderMenu();

            } catch (error) {
                console.error("Error loading menu:", error);
                menuGrid.innerHTML = "<div class='text-danger w-100 text-center'>เกิดข้อผิดพลาดในการโหลดเมนู: " + error.message + "</div>";
            }
        }

        function renderCategories(categories) {
            const container = document.getElementById('categoryContainer');
            let html = '<button class="btn btn-danger cat-btn active" onclick="filterCategory(\'all\', this)">ทั้งหมด</button>';
            
            categories.forEach(cat => {
                html += '<button class="btn btn-outline-secondary cat-btn" onclick="filterCategory(\'' + cat + '\', this)">' + cat + '</button>';
            });

            container.innerHTML = html;
        }

        function filterCategory(cat, btnElement) {
            selectedCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('btn-danger', 'active');
                btn.classList.add('btn-outline-secondary');
            });
            btnElement.classList.remove('btn-outline-secondary');
            btnElement.classList.add('btn-danger', 'active');
            renderMenu();
        }

        function renderMenu() {
            const menuGrid = document.getElementById('menuGrid');
            let html = "";

            let filteredItems = (selectedCategory === 'all') 
                ? allMenuItems 
                : allMenuItems.filter(item => item.category === selectedCategory);

            if (filteredItems.length === 0) {
                menuGrid.innerHTML = "<div class='text-center w-100 my-4 text-muted'>ไม่มีรายการในหมวดหมู่นี้</div>";
                return;
            }

            filteredItems.forEach(item => {
                let itemId = item.id;
                let itemName = item.name || "ไม่มีชื่อเมนู";
                let itemPrice = item.price || 0;
                let itemImg = item.image || "https://placehold.co/150x150?text=Food";
                let currentQty = cart[itemId] ? cart[itemId].qty : 0;

                html += `
                <div class="col-6 col-md-4 col-lg-3">
                    <div class="menu-card p-2 text-center h-100 d-flex flex-column">
                        <img src="${itemImg}" class="menu-img rounded mb-2" onerror="this.src='https://placehold.co/150x150?text=No+Image'">
                        <div class="fw-bold text-dark flex-grow-1" style="font-size: 14px;">${itemName}</div>
                        <div class="text-danger small fw-bold mb-2">${itemPrice} ฿</div>
                        <div class="d-flex justify-content-center align-items-center gap-2 mt-auto">
                            <button class="btn btn-outline-danger qty-btn" onclick="updateQty('${itemId}', -1, '${itemName}', ${itemPrice})">-</button>
                            <span id="qty-${itemId}" class="fw-bold">${currentQty}</span>
                            <button class="btn btn-success qty-btn" onclick="updateQty('${itemId}', 1, '${itemName}', ${itemPrice})">+</button>
                        </div>
                    </div>
                </div>`;
            });

            menuGrid.innerHTML = html;
        }

        function updateQty(itemId, change, itemName, itemPrice) {
            if (!tableNo) return alert("กรุณาเลือกโต๊ะก่อนสั่งอาหารครับ!");

            if (!cart[itemId]) cart[itemId] = { name: itemName, price: itemPrice, qty: 0 };
            
            cart[itemId].qty += change;
            
            if (cart[itemId].qty <= 0) {
                delete cart[itemId];
                if(document.getElementById(`qty-${itemId}`)) document.getElementById(`qty-${itemId}`).innerText = "0";
            } else {
                if(document.getElementById(`qty-${itemId}`)) document.getElementById(`qty-${itemId}`).innerText = cart[itemId].qty;
            }
            
            let totalItems = 0;
            for (let key in cart) { totalItems += cart[key].qty; }
            document.getElementById('cartCount').innerText = totalItems;
        }

        async function submitOrder() {
            if (!tableNo) return alert("กรุณาระบุเลขโต๊ะก่อนสั่งอาหารครับ!");
            
            let totalItems = 0;
            let totalAmount = 0;
            let orderDetails = "";

            for (let key in cart) {
                totalItems += cart[key].qty;
                totalAmount += (cart[key].price * cart[key].qty);
                orderDetails += `${cart[key].name} x ${cart[key].qty}\n`;
            }

            if (totalItems === 0) return alert("กรุณาเลือกรายการอาหารก่อนครับ");

            try {
                await db.collection("tables").doc(tableNo).collection("orders").add({
                    action: "สั่งอาหาร",
                    details: orderDetails.trim(),
                    amount: totalAmount,
                    kitchenStatus: "เตรียม",
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                alert("ส่งรายการอาหารเข้าครัวเรียบร้อยแล้วครับ!");
                cart = {};
                document.querySelectorAll('[id^="qty-"]').forEach(el => el.innerText = '0');
                document.getElementById('cartCount').innerText = '0';
                
            } catch (err) {
                alert("เกิดข้อผิดพลาดในการส่งรายการ: " + err.message);
            }
        }

        // 📌 3. คำนวณยอดบิลให้ตรงกับ Staff 100% (บุฟเฟต์ผู้ใหญ่ + บุฟเฟต์เด็ก + ออเดอร์เพิ่มเติม)
        async function loadCustomerBill() {
            let billArea = document.getElementById('billArea');
            if (!tableNo) {
                billArea.innerHTML = "<div class='alert alert-warning text-center m-0'>กรุณาระบุเลขโต๊ะก่อนครับ</div>";
                return;
            }
            
            billArea.innerHTML = "<div class='text-center my-3 text-muted'>กำลังโหลดยอดบิล...</div>";

            try {
                const tableDoc = await db.collection("tables").doc(tableNo).get();
                let tData = tableDoc.exists ? tableDoc.data() : {};

                db.collection("tables").doc(tableNo).collection("orders")
                    .orderBy("timestamp", "asc")
                    .onSnapshot(function(snapshot) {
                        let totalAmount = 0;
                        let html = `<ul class="list-group list-group-flush mb-3">`;

                        // อ่านค่าราคาบุฟเฟต์และจำนวนคน
                        let pkgName = tData.package || tData.packageName || "";
                        let adultCount = parseInt(tData.adults || tData.adultCount || tData.adult || 0);
                        let childCount = parseInt(tData.children || tData.childCount || tData.child || 0);
                        let basePrice = parseFloat(tData.packagePrice || tData.price || 0);

                        if (!basePrice && pkgName) {
                            let match = pkgName.match(/\d+/);
                            if (match) basePrice = parseFloat(match[0]);
                        }

                        // แสดงบุฟเฟต์ผู้ใหญ่
                        if (adultCount > 0 && basePrice > 0) {
                            let adultTotal = adultCount * basePrice;
                            totalAmount += adultTotal;
                            html += `<li class="list-group-item d-flex justify-content-between align-items-start px-2 py-2 bg-light rounded-2 mb-1">
                                        <div>
                                            <div class="fw-bold text-dark" style="font-size: 14px;">👨‍👩‍👧 บุฟเฟต์ผู้ใหญ่ (${pkgName || 'ปกติ'})</div>
                                            <small class="text-muted">${basePrice} ฿ × ${adultCount} ท่าน</small>
                                        </div>
                                        <span class="fw-bold text-dark">${adultTotal.toLocaleString()} ฿</span>
                                     </li>`;
                        }

                        // แสดงบุฟเฟต์เด็ก (50%)
                        if (childCount > 0 && basePrice > 0) {
                            let childPrice = basePrice * 0.5;
                            let childTotal = childCount * childPrice;
                            totalAmount += childTotal;
                            html += `<li class="list-group-item d-flex justify-content-between align-items-start px-2 py-2 bg-light rounded-2 mb-1">
                                        <div>
                                            <div class="fw-bold text-dark" style="font-size: 14px;">👶 บุฟเฟต์เด็ก (50%)</div>
                                            <small class="text-muted">${childPrice} ฿ × ${childCount} ท่าน</small>
                                        </div>
                                        <span class="fw-bold text-dark">${childTotal.toLocaleString()} ฿</span>
                                     </li>`;
                        }

                        // คำนวณรายการสั่งอาหารเพิ่มเติม
                        if (!snapshot.empty) {
                            snapshot.forEach(doc => {
                                let item = doc.data();
                                totalAmount += (item.amount || 0);

                                let kBadge = "";
                                if (item.kitchenStatus === "เตรียม") {
                                    kBadge = '<span class="badge bg-warning text-dark ms-1" style="font-size: 11px;">กำลังทำ</span>';
                                } else if (item.kitchenStatus === "เสร็จ") {
                                    kBadge = '<span class="badge bg-success ms-1" style="font-size: 11px;">เสิร์ฟแล้ว</span>';
                                }

                                let detailText = item.details ? item.details.replace(/\n/g, '<br>') : "";

                                html += `<li class="list-group-item d-flex justify-content-between align-items-start px-0 py-2">
                                            <div>
                                                <div class="fw-bold text-dark" style="font-size: 14px;">${item.action || 'สั่งอาหาร'} ${kBadge}</div>
                                                <small class="text-muted" style="font-size: 13px;">${detailText}</small>
                                            </div>
                                            <span class="fw-bold text-danger">${(item.amount || 0).toLocaleString()} ฿</span>
                                         </li>`;
                            });
                        }

                        if (totalAmount === 0 && snapshot.empty) {
                            billArea.innerHTML = "<div class='alert alert-warning text-center m-0'>ยังไม่มีรายการสั่งอาหารในรอบนี้</div>";
                            return;
                        }

                        html += `</ul>
                                 <div class="p-3 bg-light rounded-3 d-flex justify-content-between align-items-center" style="border: 1px dashed #dc3545;">
                                     <span class="fw-bold text-dark">ยอดสุทธิรวมทั้งหมด:</span>
                                     <span class="fw-bold text-danger fs-4">${totalAmount.toLocaleString()} ฿</span>
                                 </div>`;

                        billArea.innerHTML = html;
                    }, function(err) {
                        billArea.innerHTML = `<div class='alert alert-danger'>เกิดข้อผิดพลาด: ${err.message}</div>`;
                    });
            } catch (err) {
                console.error("Error loading bill:", err);
                billArea.innerHTML = `<div class='alert alert-danger'>ไม่สามารถโหลดข้อมูลบิลได้</div>`;
            }
        }
    </script>
</body>
</html>
