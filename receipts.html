<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติใบเสร็จของคุณ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .receipt-card { background: white; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-top: 5px solid #0D8ABC; }
        .dashed-line { border-bottom: 2px dashed #eee; margin: 15px 0; }
        .item-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; }
        .loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; justify-content: center; align-items: center; z-index: 9999; flex-direction: column; }
    </style>
</head>
<body class="container py-4">

    <div id="loading" class="loading-screen">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-3 text-muted">กำลังโหลดข้อมูลใบเสร็จ...</p>
    </div>

    <h4 class="fw-bold mb-4 text-center">🧾 ประวัติใบเสร็จของคุณ</h4>
    
    <div id="receiptsContainer">
        <!-- ใบเสร็จจะแสดงที่นี่ -->
    </div>

    <!-- Firebase JS SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // --- เปลี่ยน Firebase Config ให้ตรงกับโปรเจกต์ของคุณ ---
        const firebaseConfig = {
            apiKey: "AIzaSyCcSSovygMSoS6PYX_sS8T-7i62qvw_Agk",
            authDomain: "buffet-system-9b165.firebaseapp.com",
            projectId: "buffet-system-9b165",
            storageBucket: "buffet-system-9b165.firebasestorage.app",
            messagingSenderId: "144497251618",
            appId: "1:144497251618:web:cf9e2984e4c6a11a3dc17b",
            measurementId: "G-82JK3EL1HL"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- เปลี่ยน LIFF ID ตรงนี้ ---
        const LIFF_ID = "2011490016-qnih1RGR"; // แทนที่ด้วย Liff ID สำหรับเมนู "ใบเสร็จ"

        async function initLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
                const profile = await liff.getProfile();
                loadUserReceipts(profile.userId);
            } catch (err) {
                console.error("LIFF Init Error:", err);
                document.getElementById('receiptsContainer').innerHTML = `<div class="alert alert-danger">ไม่สามารถเชื่อมต่อ LINE ได้</div>`;
                document.getElementById('loading').style.display = 'none';
            }
        }

        async function loadUserReceipts(userId) {
            try {
                const container = document.getElementById('receiptsContainer');
                
                // ค้นหาบิลที่มี UID ของผู้ใช้อยู่ใน array membersRewarded
                // หมายเหตุ: การ query แบบนี้ (array-contains) ต้องรอ Firebase จัดการ index เล็กน้อย
                let querySnap = await db.collection("checkouts")
                    .orderBy("timestamp", "desc")
                    .limit(20) // ดึง 20 บิลล่าสุด
                    .get();

                let html = "";
                let foundCount = 0;

                querySnap.forEach(doc => {
                    let data = doc.data();
                    let membersData = data.membersRewarded || [];
                    
                    // เช็คว่ามี uid ของคนนี้ในบิลนี้ไหม
                    let userInBill = membersData.find(m => m.uid === userId);

                    if (userInBill) {
                        foundCount++;
                        let date = data.timestamp ? data.timestamp.toDate() : new Date();
                        let dateStr = date.toLocaleDateString('th-TH') + ' ' + date.toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'});
                        
                        let itemsHtml = "";
                        if (data.items && data.items.length > 0) {
                            data.items.forEach(it => {
                                itemsHtml += `<div class="item-row">
                                    <span>${it.name} <span class="text-muted small">x${it.qty}</span></span>
                                    <span>${it.price.toLocaleString()} บ.</span>
                                </div>`;
                            });
                        } else {
                            itemsHtml = "<div class="text-muted small text-center">ไม่มีรายละเอียดรายการ</div>";
                        }

                        let pointsText = `<span class="badge bg-success">คุณได้รับแต้ม +${userInBill.points}</span>`;

                        html += `
                            <div class="receipt-card p-3">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <h6 class="fw-bold m-0">ร้านชูใจ ชาบู</h6>
                                    <span class="text-muted small">${dateStr}</span>
                                </div>
                                <div class="text-muted small mb-2">โต๊ะ: ${data.tableNo}</div>
                                
                                <div class="dashed-line"></div>
                                ${itemsHtml}
                                <div class="dashed-line"></div>
                                
                                <div class="d-flex justify-content-between fw-bold mb-1">
                                    <span>ยอดชำระสุทธิ:</span>
                                    <span class="text-primary">${data.netTotal.toLocaleString()} บาท</span>
                                </div>
                                <div class="text-end mt-2">
                                    ${pointsText}
                                </div>
                            </div>
                        `;
                    }
                });

                if (foundCount === 0) {
                    html = `<div class="text-center text-muted p-5 bg-white rounded shadow-sm">คุณยังไม่มีประวัติใบเสร็จ</div>`;
                }

                container.innerHTML = html;

            } catch (err) {
                console.error("Error loading receipts:", err);
                document.getElementById('receiptsContainer').innerHTML = `<div class="alert alert-danger">เกิดข้อผิดพลาดในการโหลดข้อมูล</div>`;
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        // เริ่มการทำงาน
        initLiff();
    </script>
</body>
</html>
