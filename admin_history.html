<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติใบเสร็จย้อนหลัง - ระบบแคชเชียร์</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .receipt-modal-body { font-family: 'Courier New', Courier, monospace; background: white; padding: 20px; border: 1px solid #ddd; }
        .dashed-line { border-bottom: 1px dashed #000; margin: 10px 0; }
        .table-hover tbody tr:hover { cursor: pointer; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1"><i class="bi bi-receipt"></i> บิลย้อนหลัง (Receipt History)</span>
            <a href="dashboard.html" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left"></i> กลับหน้าหลัก</a>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>วัน-เวลา</th>
                                <th>โต๊ะ</th>
                                <th>ยอดสุทธิ</th>
                                <th>รหัสกะ</th>
                                <th>จัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody">
                            <tr><td colspan="5" class="text-center py-4 text-muted">กำลังโหลดข้อมูล...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal สำหรับดูรายละเอียดบิล -->
    <div class="modal fade" id="receiptModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header bg-light">
                    <h5 class="modal-title fw-bold">รายละเอียดใบเสร็จ</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body receipt-modal-body text-dark" id="receiptDetailsContent">
                    <!-- เนื้อหาบิลจะถูกแทรกที่นี่ -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ปิด</button>
                    <button type="button" class="btn btn-primary" onclick="printReceipt()"><i class="bi bi-printer"></i> พิมพ์บิลซ้ำ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase JS SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // --- 1. ใส่ Firebase Config ของคุณตรงนี้ ---
        const firebaseConfig = {
            apiKey: "AIzaSyCcSSovygMSoS6PYX_sS8T-7i62qvw_Agk",
            authDomain: "buffet-system-9b165.firebaseapp.com",
            projectId: "buffet-system-9b165",
            storageBucket: "buffet-system-9b165.firebasestorage.app",
            messagingSenderId: "144497251618",
            appId: "1:144497251618:web:cf9e2984e4c6a11a3dc17b",
            measurementId: "G-82JK3EL1HL"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allCheckouts = []; // เก็บข้อมูลบิลทั้งหมดไว้ใน memory เพื่อดึงมาโชว์ใน Modal
        const receiptModal = new bootstrap.Modal(document.getElementById('receiptModal'));

        // --- 2. ดึงข้อมูลประวัติการขาย ---
        async function loadHistory() {
            try {
                // ดึงข้อมูล 50 บิลล่าสุด
                const snapshot = await db.collection("checkouts")
                                        .orderBy("timestamp", "desc")
                                        .limit(50)
                                        .get();
                
                const tbody = document.getElementById('historyTableBody');
                tbody.innerHTML = '';
                allCheckouts = [];

                if (snapshot.empty) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">ไม่มีประวัติข้อมูล</td></tr>';
                    return;
                }

                snapshot.forEach(doc => {
                    let data = doc.data();
                    data.id = doc.id;
                    allCheckouts.push(data);

                    let dateObj = data.timestamp ? data.timestamp.toDate() : new Date();
                    let dateStr = dateObj.toLocaleDateString('th-TH') + ' ' + dateObj.toLocaleTimeString('th-TH');
                    
                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${dateStr}</td>
                        <td><span class="badge bg-secondary">โต๊ะ ${data.tableNo}</span></td>
                        <!-- ใส่ Math.round ให้ยอดสุทธิในตาราง -->
                        <td class="text-success fw-bold">${Math.round(data.netTotal || 0).toLocaleString()} ฿</td>
                        <td><small class="text-muted">${data.shiftId || '-'}</small></td>
                        <td>
                            <button class="btn btn-sm btn-info text-white" onclick="viewReceipt('${data.id}')">
                                <i class="bi bi-eye"></i> ดูบิล
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (error) {
                console.error("Error loading history:", error);
                document.getElementById('historyTableBody').innerHTML = '<tr><td colspan="5" class="text-center text-danger py-4">เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>';
            }
        }

        // --- 3. แสดงรายละเอียดบิลใน Modal ---
        function viewReceipt(docId) {
            const data = allCheckouts.find(c => c.id === docId);
            if (!data) return;

            let dateObj = data.timestamp ? data.timestamp.toDate() : new Date();
            let dateStr = dateObj.toLocaleDateString('th-TH') + ' ' + dateObj.toLocaleTimeString('th-TH');

            let itemsHtml = '';
            if (data.items && data.items.length > 0) {
                data.items.forEach(it => {
                    itemsHtml += `
                        <div class="d-flex justify-content-between mb-1">
                            <span>${it.name} <small>x${it.qty}</small></span>
                            <!-- ใส่ Math.round ให้ราคารายการอาหาร -->
                            <span>${Math.round(it.price || 0).toLocaleString()}</span>
                        </div>
                    `;
                });
            } else {
                itemsHtml = '<div class="text-muted text-center py-2">ไม่มีข้อมูลรายการ (บิลเก่า)</div>';
            }

            let membersHtml = '';
            if (data.membersRewarded && data.membersRewarded.length > 0) {
                membersHtml += `<div class="dashed-line"></div><div class="fw-bold mb-2">สมาชิกที่ได้รับแต้ม:</div>`;
                data.membersRewarded.forEach(m => {
               // ดึงชื่อ (รองรับหลายตัวแปรเผื่อไว้) ถ้าไม่มีให้ขึ้นว่า "สมาชิก"
            let memName = m.name || m.displayName || 'สมาชิก';
        
                // ดึงรูปโปรไฟล์ ถ้าตอนชำระเงินไม่ได้เซฟรูปมา ให้ใช้รูปพื้นฐาน
            let memPic = m.pictureUrl || m.picture || 'https://cdn-icons-png.flaticon.com/512/847/847969.png'; 

            membersHtml += `
            <div class="d-flex justify-content-between align-items-center mb-2 small">
                <div class="d-flex align-items-center">
                    <img src="${memPic}" width="28" height="28" class="rounded-circle me-2" style="object-fit: cover; border: 1px solid #ddd;">
                    <span class="text-dark fw-semibold text-truncate" style="max-width: 150px;">${memName}</span>
                </div>
                <span class="text-success fw-bold">+${m.points} แต้ม</span>
            </div>`;
        });
    }

            // --- ส่วนที่เพิ่มใหม่: จัดการรูปแบบการแสดงช่องทางการรับเงิน ---
            let paymentsHtml = '';
            if (data.payments && data.payments.length > 0) {
                data.payments.forEach(p => {
                    paymentsHtml += `
                        <div class="d-flex justify-content-between small text-muted">
                            <span>รับเงินมา (${p.method}):</span>
                            <span>${Math.round(p.amount || 0).toLocaleString()}</span>
                        </div>
                    `;
                });
            } else {
                paymentsHtml = `
                    <div class="d-flex justify-content-between small text-muted">
                        <span>รับเงินมา:</span>
                        <span>${Math.round(data.totalReceived || 0).toLocaleString()}</span>
                    </div>
                `;
            }

            const modalBody = document.getElementById('receiptDetailsContent');
            modalBody.innerHTML = `
                <div class="text-center mb-3">
                    <h5 class="fw-bold mb-0">ก๋วยเตี๋ยวบุฟเฟ่ต์99</h5>
                    <small>สำเนาใบเสร็จรับเงิน / COPY RECEIPT</small><br>
                    <small>โต๊ะ: ${data.tableNo} | ${dateStr}</small><br>
                    <small class="text-muted">Ref: ${data.id}</small>
                </div>
                
                <div class="dashed-line"></div>
                ${itemsHtml}
                <div class="dashed-line"></div>
                
                <!-- ครอบ Math.round() ในทุกบรรทัดตัวเลข -->
                <div class="d-flex justify-content-between mb-1">
                    <span>รวมเป็นเงิน:</span>
                    <span>${Math.round(data.total || 0).toLocaleString()}</span>
                </div>
                <div class="d-flex justify-content-between mb-1">
                    <span>ส่วนลด:</span>
                    <span>${data.discount || 'ไม่มี'}</span>
                </div>
                <div class="d-flex justify-content-between fw-bold fs-6 mt-2">
                    <span>ยอดสุทธิ:</span>
                    <span>${Math.round(data.netTotal || 0).toLocaleString()} บาท</span>
                </div>
                
                <div class="dashed-line"></div>
                
                <!-- นำตัวแปร paymentsHtml มาแสดงตรงนี้ -->
                ${paymentsHtml}
                
                <div class="d-flex justify-content-between small text-muted">
                    <span>เงินทอน:</span>
                    <span>${Math.round(data.change || 0).toLocaleString()}</span>
                </div>
                ${membersHtml}
                <div class="dashed-line"></div>
                <div class="text-center mt-3 small">*** ขอบคุณที่อุดหนุนคะ ***</div>
            `;

            receiptModal.show();
        }

        // --- 4. ฟังก์ชันสำหรับพิมพ์บิลซ้ำ (ตัวเลือกเสริม) ---
        function printReceipt() {
            const content = document.getElementById('receiptDetailsContent').innerHTML;
            const printWindow = window.open('', '', 'height=600,width=400');
            printWindow.document.write('<html><head><title>พิมพ์ใบเสร็จ</title>');
            printWindow.document.write('<style>body { font-family: "Courier New", Courier, monospace; padding: 10px; } .dashed-line { border-bottom: 1px dashed #000; margin: 10px 0; } .d-flex { display: flex; } .justify-content-between { justify-content: space-between; } .text-center { text-align: center; } .fw-bold { font-weight: bold; } .small { font-size: 0.85em; } .mb-1 { margin-bottom: 4px; } .mt-2 { margin-top: 8px; } .mt-3 { margin-top: 16px; }</style>');
            printWindow.document.write('</head><body>');
            printWindow.document.write(content);
            printWindow.document.write('</body></html>');
            printWindow.document.close();
            printWindow.focus();
            setTimeout(() => {
                printWindow.print();
                printWindow.close();
            }, 500);
        }

        // โหลดข้อมูลเมื่อเปิดหน้า
        window.onload = loadHistory;
    </script>
</body>
</html>
