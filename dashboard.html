<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - จัดการโต๊ะ</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body class="bg-light">

<div class="container mt-3 pb-5">
    <!-- ส่วนหัวหน้าจอ -->
    <h3 class="text-center text-primary fw-bold mb-4">👨‍🍳 ระบบจัดการพนักงาน / แคชเชียร์</h3>

    <!-- 1. กล่องแสดงสถานะกะ -->
    <div class="card bg-dark text-white shadow-sm mb-4" style="border-radius: 12px;">
        <div class="card-body p-3">
            <div class="d-flex align-items-center mb-2 flex-wrap gap-2">
                <span class="fs-5">🔑 สถานะกะ:</span>
                <span class="badge bg-success fs-6 rounded-pill px-3 py-2">กำลังเปิดกะ (SHIFT_1790061054093)</span>
            </div>
            <div class="mb-3">
                <span class="text-info fs-6">พนักงาน: เรย์</span>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-danger px-4" onclick="alert('ฟังก์ชันปิดกะ')">ปิดกะ</button>
                <button class="btn btn-outline-light text-white border-secondary">💸 เงินเข้า-ออก</button>
                <button class="btn btn-outline-info text-info border-info">📜 บิลย้อนหลัง</button>
            </div>
        </div>
    </div>

    <!-- 2. กล่องสถานะและผังโต๊ะ -->
    <div class="card shadow-sm" style="border-radius: 12px;">
        <div class="card-body p-3">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                <h4 class="mb-0 fw-bold"><span class="text-danger">📌</span> สถานะโต๊ะ</h4>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-danger px-3 bg-white" style="border-radius: 8px;">- โต๊ะ</button>
                    <button class="btn btn-outline-primary px-3 bg-white" style="border-radius: 8px;">+ โต๊ะ</button>
                    <button class="btn btn-secondary px-3" style="border-radius: 8px;" onclick="location.reload()">🔄 รีเฟรช</button>
                </div>
            </div>

            <!-- ผังโต๊ะ -->
            <div class="row row-cols-3 row-cols-md-4 row-cols-lg-5 g-2" id="tableGridContainer">
                
                <!-- ตัวอย่างโต๊ะ 1 -->
                <div class="col">
                    <div class="card text-center h-100 shadow-sm" 
                         style="background-color: #ffe6e6; border: 1px solid #ffb3b3; border-radius: 10px; cursor: pointer;" 
                         onclick="openTable(1)">
                        <div class="card-body p-2 d-flex flex-column justify-content-center align-items-center">
                            <div class="text-danger fw-bold fs-5 mb-1">โต๊ะ 1</div>
                            <div class="text-danger fw-bold fs-5">👤 <span class="ms-1">3</span></div>
                            <div class="text-danger fw-bold fs-6">คน</div>
                        </div>
                    </div>
                </div>

                <!-- ตัวอย่างโต๊ะ 2 -->
                <div class="col">
                    <div class="card text-center h-100 shadow-sm" 
                         style="background-color: #e6f9e6; border: 1px solid #b3ffb3; border-radius: 10px; cursor: pointer;" 
                         onclick="openTable(2)">
                        <div class="card-body p-2 d-flex flex-column justify-content-center align-items-center">
                            <div class="text-success fw-bold fs-5 mb-1">โต๊ะ 2</div>
                            <div class="text-secondary fs-6">ว่าง</div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- 3. ส่วนแผงควบคุมโต๊ะ (ถูกซ่อนไว้ จะแสดงเมื่อกดเลือกโต๊ะ) -->
    <div id="tableActionSection" class="mt-4" style="display: none;">
        <div class="alert alert-secondary py-2 text-center fw-bold mb-3 shadow-sm" style="border-radius: 10px;">
            กำลังเลือก: โต๊ะ <span id="selectedTableBadge" class="text-primary fs-5">...</span>
        </div>

        <!-- ปุ่มจัดการด่วน 3 ปุ่ม -->
        <div class="row g-2 text-center mb-3">
            <div class="col-4">
                <button class="btn btn-outline-success w-100 py-3 shadow-sm d-flex flex-column align-items-center justify-content-center h-100" 
                        style="border-width: 2px; border-radius: 12px; background-color: #fff;" 
                        onclick="openMemberModal()">
                    <div class="fs-2 mb-1">👥</div>
                    <div class="fw-bold fs-6 text-success" style="font-size: 0.9rem !important;">สมาชิกในโต๊ะ</div>
                </button>
            </div>
            <div class="col-4">
                <button class="btn btn-outline-secondary w-100 py-3 shadow-sm d-flex flex-column align-items-center justify-content-center h-100" 
                        style="border-width: 2px; border-radius: 12px; background-color: #fff;" 
                        onclick="openMoveTableModal()">
                    <div class="fs-2 mb-1">🔄</div>
                    <div class="fw-bold fs-6 text-secondary" style="font-size: 0.9rem !important;">ย้ายโต๊ะ</div>
                </button>
            </div>
            <div class="col-4">
                <button class="btn btn-outline-danger w-100 py-3 shadow-sm d-flex flex-column align-items-center justify-content-center h-100" 
                        style="border-width: 2px; border-radius: 12px; background-color: #fff;" 
                        onclick="cancelTable()">
                    <div class="fs-2 mb-1">❌</div>
                    <div class="fw-bold fs-6 text-danger" style="font-size: 0.9rem !important;">ยกเลิกโต๊ะ</div>
                </button>
            </div>
        </div>

        <!-- ปุ่มหลัก: เข้าโต๊ะ -->
        <button class="btn btn-primary w-100 py-3 fs-4 fw-bold shadow" 
                style="border-radius: 12px;" 
                onclick="goToTableDetail()">
            🚪 เข้าโต๊ะ ➡️
        </button>
    </div>

</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // ==========================================
    // 1. นำโค้ด Initialize Firebase ของคุณมาวางตรงนี้ (ถ้ามี)
    // ==========================================
    /*
    const firebaseConfig = { ... };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    */

    // ==========================================
    // 2. ระบบเลือกโต๊ะและเปลี่ยนหน้า
    // ==========================================
    let selectedTableNo = null;

    function openTable(tNo) {
        selectedTableNo = tNo;
        document.getElementById('selectedTableBadge').innerText = tNo;

        // แสดงแผงควบคุมและเลื่อนหน้าจอลงมา
        const actionSection = document.getElementById('tableActionSection');
        actionSection.style.display = 'block';
        actionSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function goToTableDetail() {
        if (!selectedTableNo) {
            alert("กรุณาเลือกโต๊ะก่อนครับ");
            return;
        }
        window.location.href = "table.html?table=" + selectedTableNo;
    }

    // ==========================================
    // 3. ฟังก์ชันการทำงานของ 3 ปุ่มจัดการด่วน
    // ==========================================
    function openMemberModal() {
        if (!selectedTableNo) return alert("กรุณาเลือกโต๊ะก่อนครับ");
        alert("ระบบจัดการสมาชิก โต๊ะ " + selectedTableNo);
    }

    function openMoveTableModal() {
        if (!selectedTableNo) return alert("กรุณาเลือกโต๊ะก่อนครับ");
        alert("ระบบย้ายโต๊ะ จากโต๊ะ " + selectedTableNo);
    }

    async function cancelTable() {
        if (!selectedTableNo) return alert("กรุณาเลือกโต๊ะก่อนครับ");
        if (confirm("ยืนยันการยกเลิกโต๊ะ " + selectedTableNo + " ใช่หรือไม่? ข้อมูลของโต๊ะนี้จะถูกล้าง")) {
            alert("ยกเลิกโต๊ะ " + selectedTableNo + " สำเร็จ");
        }
    }
</script>

</body>
</html>
