<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการพนักงาน / แคชเชียร์</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- SweetAlert2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Kanit', sans-serif, system-ui;
        }
        .header-card {
            background-color: #1a2332;
            color: #ffffff;
            border-radius: 16px;
        }
        .status-badge-open {
            background-color: #198754;
            color: #ffffff;
            font-size: 0.85rem;
            padding: 4px 12px;
            border-radius: 20px;
        }
        .table-card {
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.15s ease, shadow 0.15s ease;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .table-card:hover {
            transform: translateY(-3px);
        }
        .table-free {
            background-color: #eafaf1;
            border: 2px solid #a3e635;
            color: #15803d;
        }
        .table-busy {
            background-color: #fce8e6;
            border: 2px solid #fca5a5;
            color: #b91c1c;
        }
        .btn-action-custom {
            border-radius: 8px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container py-3" style="max-width: 600px;">

    <!-- ส่วนหัวข้อหลัก -->
    <div class="text-center mb-3">
        <h4 class="fw-bold text-primary">👨‍🍳 ระบบจัดการพนักงาน / แคชเชียร์</h4>
    </div>

    <!-- การ์ดสถานะกะและปุ่มเมนูหลัก -->
    <div class="header-card p-3 p-md-4 mb-4 shadow-sm">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-key-fill text-warning fs-4"></i>
                <span class="fw-bold">สถานะกะ:</span>
            </div>
            <span id="shiftStatusBadge" class="status-badge-open fw-bold">กำลังเปิดกะ (กำลังโหลด...)</span>
        </div>

        <div class="mb-3">
            <span class="text-white-50 me-2">พนักงานรับผิดชอบ:</span>
            <span class="fw-bold text-info fs-5"><i class="bi bi-person-circle"></i> <span id="staffNameDisplay">เรย์</span></span>
        </div>

        <!-- ปุ่มเมนูหลัก -->
        <div class="d-flex flex-wrap gap-2">
            <button class="btn btn-danger btn-action-custom flex-fill" onclick="closeShift()">
                <i class="bi bi-power"></i> ปิดกะ
            </button>
            <button class="btn btn-outline-light btn-action-custom flex-fill" onclick="addCashFlow()">
                <i class="bi bi-cash-stack"></i> เงินเข้า-ออก
            </button>
            <button class="btn btn-outline-light btn-action-custom flex-fill" onclick="viewHistory()">
                <i class="bi bi-journal-text"></i> บิลย้อนหลัง
            </button>
        </div>
    </div>

    <!-- ส่วนสถานะโต๊ะ -->
    <div class="bg-white p-3 p-md-4 rounded-4 shadow-sm">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0 text-dark"><i class="bi bi-pin-angle-fill text-danger"></i> สถานะโต๊ะ</h5>
            <div class="d-flex gap-1">
                <button class="btn btn-outline-danger btn-sm" onclick="removeTable()">- โต๊ะ</button>
                <button class="btn btn-outline-primary btn-sm" onclick="addTable()">+ โต๊ะ</button>
                <button class="btn btn-secondary btn-sm" onclick="refreshTables()"><i class="bi bi-arrow-clockwise"></i> รีเฟรช</button>
            </div>
        </div>

        <!-- รายการผังโต๊ะ (จะถูก Render ผ่าน JavaScript) -->
        <div class="row g-2" id="tableContainer">
            <div class="text-center text-muted py-4">กำลังโหลดข้อมูลโต๊ะ...</div>
        </div>
    </div>

</div>

<!-- Firebase SDK Compat -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<!-- SweetAlert2 JS -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    // --- 1. ตั้งค่า Firebase (ใช้คอนฟิกเดิมของคุณ) ---
    const firebaseConfig = {
        // ใส่ firebaseConfig ของคุณที่นี่ หากมีแยกไฟล์ไว้แล้วสามารถตัดส่วนนี้ออกได้ครับ
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // ตัวแปรระบบ
    let currentShiftId = null;

    // --- 2. ติดตามสถานะกะทำงาน (Realtime) ---
    function listenToCurrentShift() {
        db.collection("shifts")
          .where("status", "==", "open")
          .limit(1)
          .onSnapshot(snapshot => {
              const badge = document.getElementById('shiftStatusBadge');
              if (!snapshot.empty) {
                  const shiftDoc = snapshot.docs[0];
                  currentShiftId = shiftDoc.id;
                  badge.className = "status-badge-open fw-bold";
                  badge.innerText = `กำลังเปิดกะ (${currentShiftId.substring(0, 12)}...)`;
              } else {
                  currentShiftId = null;
                  badge.className = "bg-secondary text-white fw-bold px-3 py-1 rounded-pill";
                  badge.innerText = `ยังไม่ได้เปิดกะ`;
              }
          }, error => {
              console.error("Shift listener error:", error);
          });
    }

    // --- 3. ดึงข้อมูลโต๊ะและเรียงลำดับด้วย JavaScript ---
    function listenToTables() {
        db.collection("tables").onSnapshot(snapshot => {
            const container = document.getElementById('tableContainer');
            if (!container) return;
            
            container.innerHTML = '';
            let tablesArray = [];
            
            snapshot.forEach(doc => {
                tablesArray.push({ tableId: doc.id, ...doc.data() });
            });

            // เรียงลำดับเลขโต๊ะตามตัวเลข
            tablesArray.sort((a, b) => parseInt(a.tableId) - parseInt(b.tableId));

            if (tablesArray.length === 0) {
                container.innerHTML = `<div class="text-center text-muted py-4">ยังไม่มีข้อมูลโต๊ะ กด "+ โต๊ะ" เพื่อเพิ่มโต๊ะได้ครับ</div>`;
                return;
            }

            tablesArray.forEach(table => {
                let cardHtml = '';
                const isBusy = table.status === 'busy' || table.status === 'ไม่ว่าง' || (table.people && table.people > 0);

                if (isBusy) {
                    cardHtml = `
                        <div class="col-6 col-sm-4">
                            <div class="table-card table-busy shadow-sm" onclick="openTableModal('${table.tableId}')">
                                <div class="fw-bold fs-5">โต๊ะ ${table.id || table.tableId}</div>
                                <div class="d-flex align-items-center gap-1 my-1">
                                    <i class="bi bi-person-fill fs-5"></i>
                                    <span class="fw-bold fs-5">${table.people || 0}</span>
                                </div>
                                <div class="small fw-bold">คน</div>
                            </div>
                        </div>`;
                } else {
                    cardHtml = `
                        <div class="col-6 col-sm-4">
                            <div class="table-card table-free shadow-sm" onclick="openNewTable('${table.tableId}')">
                                <div class="fw-bold fs-5">โต๊ะ ${table.id || table.tableId}</div>
                                <div class="mt-2 fs-6"><i class="bi bi-check-circle"></i> ว่าง</div>
                            </div>
                        </div>`;
                }
                container.innerHTML += cardHtml;
            });
        });
    }

    // --- 4. ฟังก์ชันปิดกะ (SweetAlert2 Custom UI) ---
    async function closeShift() {
        if (!currentShiftId) {
            Swal.fire('แจ้งเตือน', 'ยังไม่มีการเปิดกะในระบบ', 'warning');
            return;
        }

        const { value: actualCash } = await Swal.fire({
            html: `
                <div style="background-color: #dc3545; color: white; padding: 15px; margin: -1.25em -1.25em 15px -1.25em; text-align: left; font-size: 1.2rem; font-weight: bold; border-radius: 4px 4px 0 0; display: flex; justify-content: space-between; align-items: center;">
                    <span>🔴 ปิดกะการทำงาน</span>
                    <span style="cursor: pointer; font-size: 1.5rem;" onclick="Swal.close()">×</span>
                </div>
                <div style="background-color: #fff3cd; color: #856404; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; text-align: left; border: 1px solid #ffeeba;">
                    กรุณานับเงินสดจริงทั้งหมดที่มีอยู่ในลิ้นชัก ณ ตอนนี้ แล้วระบุลงในช่องด้านล่าง
                </div>
                <div style="text-align: left;">
                    <label style="font-weight: bold; margin-bottom: 8px; display: block; color: #333;">เงินสดในลิ้นชักที่นับได้จริง (บาท):</label>
                    <input id="swal-input-cash" type="number" class="swal2-input" style="width: 100%; margin: 0; box-sizing: border-box;" placeholder="0.00" step="0.01">
                </div>
            `,
            showCancelButton: true,
            confirmButtonText: 'ยืนยันปิดกะ',
            cancelButtonText: 'ยกเลิก',
            confirmButtonColor: '#dc3545',
            cancelButtonColor: '#6c757d',
            focusConfirm: false,
            preConfirm: () => {
                const cash = document.getElementById('swal-input-cash').value;
                if (!cash || isNaN(parseFloat(cash))) {
                    Swal.showValidationMessage('กรุณากรอกจำนวนเงินสดที่ถูกต้อง');
                    return false;
                }
                return parseFloat(cash);
            }
        });

        if (actualCash !== undefined) {
            try {
                await db.collection("shifts").doc(currentShiftId).update({
                    endTime: firebase.firestore.FieldValue.serverTimestamp(),
                    actualCash: actualCash,
                    status: 'closed'
                });

                Swal.fire({
                    icon: 'success',
                    title: 'ปิดกะเรียบร้อยแล้ว',
                    showConfirmButton: false,
                    timer: 1500
                }).then(() => {
                    location.reload();
                });
            } catch (error) {
                console.error("Error closing shift:", error);
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถปิดกะได้: ' + error.message, 'error');
            }
        }
    }

    // --- 5. ฟังก์ชันบันทึกเงินเข้า - เงินออก (SweetAlert2 Custom UI) ---
    async function addCashFlow() {
        if (!currentShiftId) {
            Swal.fire('แจ้งเตือน', 'กรุณาเปิดกะก่อนบันทึกรายการเงินเข้า-ออก', 'warning');
            return;
        }

        const { value: formValues } = await Swal.fire({
            html: `
                <div style="background-color: #0dcaf0; color: white; padding: 15px; margin: -1.25em -1.25em 15px -1.25em; text-align: left; font-size: 1.2rem; font-weight: bold; border-radius: 4px 4px 0 0; display: flex; justify-content: space-between; align-items: center;">
                    <span>💸 บันทึกเงินเข้า - เงินออก</span>
                    <span style="cursor: pointer; font-size: 1.5rem;" onclick="Swal.close()">×</span>
                </div>
                <div style="text-align: left; padding: 0 5px;">
                    <label style="font-weight: bold; margin-bottom: 5px; display: block; color: #333;">ประเภทรายการ:</label>
                    <select id="swal-type" class="swal2-select" style="width: 100%; margin: 0 0 15px 0; box-sizing: border-box; display: flex;">
                        <option value="out">เงินออก (จ่ายค่าน้ำแข็ง / ของสดเติมด่วน)</option>
                        <option value="in">เงินเข้า (เงินทอนเพิ่มเติม / อื่นๆ)</option>
                    </select>

                    <label style="font-weight: bold; margin-bottom: 5px; display: block; color: #333;">จำนวนเงิน (บาท):</label>
                    <input id="swal-amount" type="number" class="swal2-input" style="width: 100%; margin: 0 0 15px 0; box-sizing: border-box;" placeholder="0.00" step="0.01">

                    <label style="font-weight: bold; margin-bottom: 5px; display: block; color: #333;">หมายเหตุ / เหตุผล:</label>
                    <input id="swal-note" type="text" class="swal2-input" style="width: 100%; margin: 0; box-sizing: border-box;" placeholder="เช่น ซื้อน้ำแข็งเพิ่ม">
                </div>
            `,
            showCancelButton: true,
            confirmButtonText: 'บันทึก',
            cancelButtonText: 'ยกเลิก',
            confirmButtonColor: '#0dcaf0',
            cancelButtonColor: '#6c757d',
            focusConfirm: false,
            preConfirm: () => {
                const type = document.getElementById('swal-type').value;
                const amount = parseFloat(document.getElementById('swal-amount').value);
                const note = document.getElementById('swal-note').value;
                
                if (!amount || isNaN(amount) || amount <= 0) {
                    Swal.showValidationMessage('กรุณากรอกจำนวนเงินให้ถูกต้องและมากกว่า 0');
                    return false;
                }
                return { type, amount, note };
            }
        });

        if (formValues) {
            try {
                await db.collection("cash_flows").add({
                    shiftId: currentShiftId,
                    type: formValues.type,
                    amount: formValues.amount,
                    note: formValues.note,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    staffName: document.getElementById('staffNameDisplay').innerText || "เรย์"
                });

                Swal.fire({
                    icon: 'success',
                    title: 'บันทึกรายการสำเร็จ',
                    showConfirmButton: false,
                    timer: 1500
                });
            } catch (error) {
                console.error("Error adding cash flow:", error);
                Swal.fire('ข้อผิดพลาด', 'บันทึกไม่สำเร็จ: ' + error.message, 'error');
            }
        }
    }

    // --- 6. ฟังก์ชันจัดการโต๊ะ (+ โต๊ะ / - โต๊ะ / เปิดโต๊ะ) ---
    async function addTable() {
        const snapshot = await db.collection("tables").get();
        const nextId = snapshot.size + 1;
        await db.collection("tables").doc(String(nextId)).set({
            id: nextId,
            status: 'free',
            people: 0
        });
    }

    async function removeTable() {
        const snapshot = await db.collection("tables").get();
        if (snapshot.size > 0) {
            const lastId = snapshot.size;
            await db.collection("tables").doc(String(lastId)).delete();
        }
    }

    function refreshTables() {
        listenToTables();
    }

    function openNewTable(tableId) {
        Swal.fire(`เปิดโต๊ะ ${tableId}`, 'ใส่ฟังก์ชันเปิดโต๊ะใหม่ตามระบบเดิมของคุณตรงนี้', 'info');
    }

    function openTableModal(tableId) {
        Swal.fire(`จัดการโต๊ะ ${tableId}`, 'ใส่ฟังก์ชันจัดการโต๊ะ/ชำระเงินตามระบบเดิมของคุณตรงนี้', 'info');
    }

    function viewHistory() {
        Swal.fire('บิลย้อนหลัง', 'เปิดดูรายการบิลย้อนหลัง', 'info');
    }

    // --- 7. เริ่มทำงานเมื่อโหลดหน้าเว็บ ---
    document.addEventListener("DOMContentLoaded", () => {
        listenToCurrentShift();
        listenToTables();
    });
</script>

</body>
</html>
