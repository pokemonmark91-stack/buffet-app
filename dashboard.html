<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการกะ & ผังโต๊ะ - ระบบบุฟเฟต์</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .table-card { cursor: pointer; transition: 0.2s; }
        .table-card:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .bg-free { background-color: #e8f5e9 !important; border-color: #c8e6c9 !important; }
        .bg-active { background-color: #ffebee !important; border-color: #ffcdd2 !important; }
    </style>
</head>
<body class="container py-3">

    <!-- Menu Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 rounded shadow-sm px-3">
        <a class="navbar-brand fw-bold text-warning" href="index.html">👨‍🍳 Buffet POS</a>
        <div class="navbar-nav d-flex flex-row gap-3 ms-auto align-items-center">
            <a class="nav-link active fw-bold" href="index.html">📌 ผังโต๊ะ & จัดการกะ</a>
            <!-- ปุ่มไปหน้า 2 (สั่งอาหาร) -->
            <a class="btn btn-warning btn-sm fw-bold text-dark px-3" href="order.html">🍲 ไปหน้าสั่งอาหาร</a>
            <a class="nav-link text-white" href="checkout.html">🧾 คิดเงิน</a>
            <a class="nav-link text-white" href="members.html">🎁 สมาชิก</a>
        </div>
    </nav>

    <!-- [ส่วนที่มาจากหน้า 4] สถานะและการจัดการกะ -->
    <div class="card p-3 shadow-sm mb-4 bg-dark text-white rounded-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h5 class="fw-bold m-0 text-warning">🔑 สถานะกะการทำงานปัจจุบัน</h5>
            <span id="shiftStatusText" class="badge bg-secondary">กำลังตรวจสอบ...</span>
        </div>
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div>
                <span class="small text-info me-2" id="shiftStaffText">พนักงาน: -</span>
                <span class="small text-light" id="shiftTimeText">เวลาเปิด: -</span>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-sm btn-warning fw-bold" id="btnShiftAction" onclick="handleShiftAction()">เปิดกะ</button>
                <button class="btn btn-sm btn-outline-light" onclick="openCashFlowModal()">💸 เงินเข้า-ออก</button>
                <button class="btn btn-sm btn-outline-info" onclick="openBillHistoryModal()">📜 บิลย้อนหลัง</button>
            </div>
        </div>
    </div>

    <!-- [ส่วนที่มาจากหน้า 1] สถานะผังโต๊ะ -->
    <div class="card p-3 shadow-sm mb-4 bg-white">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold m-0 text-primary">📌 ผังสถานะโต๊ะ</h5>
            <div class="d-flex gap-2">
                <button class="btn btn-sm btn-outline-danger" onclick="changeTableCount(-1)">- โต๊ะ</button>
                <button class="btn btn-sm btn-outline-primary" onclick="changeTableCount(1)">+ โต๊ะ</button>
                <button class="btn btn-sm btn-secondary" onclick="loadDashboard()">🔄 รีเฟรช</button>
            </div>
        </div>

        <!-- แสดงการ์ดโต๊ะ (สร้างผ่าน JS) -->
        <div id="tableGrid" class="row g-2 mb-3">
            <!-- ตัวอย่างการ์ดโต๊ะว่าง -->
            <div class="col-6 col-md-3">
                <div class="card p-2 text-center table-card bg-free">
                    <h6 class="fw-bold m-0">โต๊ะ 1</h6>
                    <small class="text-success">ว่าง</small>
                </div>
            </div>
            <!-- ตัวอย่างการ์ดโต๊ะที่มีลูกค้า + ปุ่มทางลัดไปหน้าสั่งอาหาร -->
            <div class="col-6 col-md-3">
                <div class="card p-2 text-center table-card bg-active">
                    <h6 class="fw-bold m-0">โต๊ะ 2</h6>
                    <small class="text-danger">3 คน (บุฟเฟต์ 299)</small>
                    <a href="order.html?table=2" class="btn btn-sm btn-outline-danger mt-2 fw-bold">🍲 สั่งอาหาร</a>
                </div>
            </div>
        </div>
    </div>

    <!-- [ส่วนที่มาจากหน้า 1] ฟอร์มเปิดโต๊ะใหม่ -->
    <div class="card p-3 shadow-sm mb-4 bg-white">
        <h5 class="fw-bold mb-3 text-success">🛎️ เปิดโต๊ะใหม่</h5>
        <div class="row g-2">
            <div class="col-12 col-md-3">
                <label class="form-label small fw-bold">เลขโต๊ะ:</label>
                <input type="text" id="tNo" class="form-control form-control-sm" placeholder="เช่น 1, 2">
            </div>
            <div class="col-6 col-md-3">
                <label class="form-label small fw-bold">ผู้ใหญ่ (เต็มราคา):</label>
                <input type="number" id="pplAdult" class="form-control form-control-sm" value="1" min="0">
            </div>
            <div class="col-6 col-md-3">
                <label class="form-label small fw-bold">เด็ก (ครึ่งราคา 50%):</label>
                <input type="number" id="pplChild" class="form-control form-control-sm" value="0" min="0">
            </div>
            <div class="col-12 col-md-3">
                <label class="form-label small fw-bold">เลือกแพ็กเกจ:</label>
                <select id="pkg" class="form-select form-select-sm"></select>
            </div>
            <div class="col-12 mt-3 d-flex gap-2">
                <button class="btn btn-success btn-sm w-50 fw-bold" onclick="openNewTable()">✅ เปิดโต๊ะ</button>
                <!-- ปุ่มเปิดโต๊ะแล้วเด้งไปหน้าสั่งอาหารทันที -->
                <button class="btn btn-warning btn-sm w-50 fw-bold" onclick="openTableAndOrder()">✅ เปิดโต๊ะ & ไปสั่งอาหาร ➔</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // ฟังก์ชันตัวอย่างการเปิดโต๊ะแล้วส่งข้ามไปหน้า order.html (หน้า 2)
        function openTableAndOrder() {
            const tableNo = document.getElementById('tNo').value;
            if (!tableNo) {
                alert('กรุณาระบุเลขโต๊ะ');
                return;
            }
            // Logic บันทึกเปิดโต๊ะใน Firebase...
            
            // เมื่อเปิดสำเร็จ ส่งไปหน้า order.html พร้อมระบุเลขโต๊ะผ่าน URL
            window.location.href = `order.html?table=${tableNo}`;
        }
    </script>
</body>
</html>
