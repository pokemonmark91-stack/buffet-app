<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - จัดการโต๊ะ</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Firebase Scripts (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <style>
        .table-card { transition: transform 0.2s; cursor: pointer; }
        .table-card:hover { transform: scale(1.03); }
        .action-btn { border-width: 2px; border-radius: 12px; background-color: #fff; transition: all 0.2s; }
        .action-btn:hover { background-color: #f8f9fa; transform: translateY(-2px); }
        .occupied-table { background-color: #ffe6e6 !important; border: 1px solid #ffb3b3 !important; }
        .vacant-table { background-color: #e6f9e6 !important; border: 1px solid #b3ffb3 !important; }
    </style>
</head>
<body class="bg-light">

<div class="container mt-3 pb-5" style="max-width: 800px;">
    <!-- ส่วนหัวหน้าจอ -->
    <div class="text-center mb-4">
        <h3 class="text-primary fw-bold">👨‍🍳 ระบบจัดการพนักงาน / แคชเชียร์</h3>
    </div>

    <!-- ========================================== -->
    <!-- 1. กล่องสถานะกะ (Shift Status) -->
    <!-- ========================================== -->
    <div class="card bg-dark text-white shadow-sm mb-4" style="border-radius: 12px;">
        <div class="card-body p-3">
            <div class="d-flex align-items-center mb-2 flex-wrap gap-2">
                <span class="fs-5 text-warning fw-bold">🔑 สถานะกะ:</span>
                <span class="badge bg-success fs-6 rounded-pill px-3 py-2">กำลังเปิดกะ (SHIFT_1790061054093)</span>
            </div>
            <div class="mb-3">
                <span class="text-info fs-6">พนักงาน: เรย์</span>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-danger px-4 fw-bold" onclick="closeShift()">ปิดกะ</button>
                <button class="btn btn-outline-light text-white border-secondary" onclick="manageCash()">💸 เงินเข้า-ออก</button>
                <button class="btn btn-outline-info text-info border-info" onclick="viewHistory()">📜 บิลย้อนหลัง</button>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 2. กล่องสถานะและผังโต๊ะ (Table Grid) -->
    <!-- ========================================== -->
    <div class="card shadow-sm mb-4" style="border-radius: 12px;">
        <div class="card-body p-3">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                <h4 class="mb-0 fw-bold"><span class="text-danger">📌</span> สถานะโต๊ะ</h4>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-danger px-3 bg-white" style="border-radius: 8px;" onclick="removeTable()">- โต๊ะ</button>
                    <button class="btn btn-outline-primary px-3 bg-white" style="border-radius: 8px;" onclick="addTable()">+ โต๊ะ</button>
                    <button class="btn btn-secondary px-3" style="border-radius: 8px;" onclick="fetchTables()">🔄 รีเฟรช</button>
                </div>
            </div>

            <!-- ผังโต๊ะแสดงผลแบบ Dynamic -->
            <div class="row row-cols-3 row-cols-md-4 g-2" id="tableGridContainer">
                <!-- โหลดข้อมูลโต๊ะจาก Firebase หรือ Mock ข้อมูลเบื้องต้น -->
                <div class="col">
                    <div class="card text-center h-100 shadow-sm table-card occupied-table" onclick="selectTable(1)">
                        <div class="card-body p-2 d-flex flex-column justify-content-center align-items-center">
                            <div class="text-danger fw-bold fs-5 mb-1">โต๊ะ 1</div>
                            <div class="text-danger fw-bold fs-5">👥 <span class="ms-1">3</span></div>
                            <div class="text-danger fw-bold fs-6">คน</div>
                        </div>
                    </div>
                </div>
                <div class="col">
                    <div class="card text-center h-100 shadow-sm table-card vacant-table" onclick="selectTable(2)">
                        <div class="card-body p-2 d-flex flex-column justify-content-center align-items-center">
                            <div class="text-success fw-bold fs-5 mb-1">โต๊ะ 2</div>
                            <div class="text-secondary fs-6">ว่าง</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 3. แผงควบคุมโต๊ะ (ซ่อนไว้ จะโชว์เมื่อกดโต๊ะ) -->
    <!-- ========================================== -->
    <div id="tableActionSection" class="p-3 bg-white shadow-sm" style="display: none; border-radius: 12px; border: 1px solid #dee2e6;">
        <div class="alert py-2 text-center fw-bold mb-3" style="background-color: #e9ecef; border-radius: 10px;">
            กำลังเลือก: โต๊ะ <span id="selectedTableBadge" class="text-primary fs-4">...</span>
        </div>

        <div class="row g-2 text-center mb-3">
            <div class="col-4">
                <button class="btn btn-outline-success w-100 py-3 shadow-sm d-flex flex-column align-items-center justify-content-center h-100 action-btn" 
                        onclick="openMemberModal()">
                    <div class="fs-1 mb-1">👥</div>
                    <div class="fw-bold text-success" style="font-size: 0.85rem;">สมาชิกในโต๊ะ</div>
                </button>
            </div>
            <div class="col-4">
                <button class="btn btn-outline-secondary w-100 py-3 shadow-sm d-flex flex-column align-items-center justify-content-center h-100 action-btn" 
                        onclick="openMoveTableModal()">
                    <div class="fs-1 mb-1">🔄</div>
                    <div class="fw-bold text-secondary" style="font-size: 0.85rem;">ย้ายโต๊ะ</div>
                </button>
            </div>
            <div class="col-4">
                <button class="btn btn-outline-danger w-100 py-3 shadow-sm d-flex flex-column align-items-center justify-content-center h-100 action-btn" 
                        onclick="cancelTable()">
                    <div class="fs-1 mb-1">❌</div>
                    <div class="fw-bold text-danger" style="font-size: 0.85rem;">ยกเลิกโต๊ะ</div>
                </button>
            </div>
        </div>

        <button class="btn btn-primary w-100 py-3 fs-4 fw-bold shadow text-white" 
                style="border-radius: 12px; background-color: #0d6efd; border: none;" 
                onclick="goToTableDetail()">
            🚪 เข้าโต๊ะ ➡️
        </button>
    </div>

</div>

<!-- ========================================== -->
<!-- MODAL: จัดการจำนวนสมาชิกในโต๊ะ -->
<!-- ========================================== -->
<div class="modal fade" id="memberModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content" style="border-radius: 15px;">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title fw-bold">👥 จัดการจำนวนลูกค้า - โต๊ะ <span id="modalTableNo"></span></h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label fw-bold">จำนวนผู้ใหญ่ (เต็มราคา):</label>
                    <input type="number" id="adultCount" class="form-control form-control-lg" value="1" min="1">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">จำนวนเด็ก (ราคา 50%):</label>
                    <input type="number" id="childCount" class="form-control form-control-lg" value="0" min="0">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
                <button type="button" class="btn btn-success fw-bold" onclick="saveTableMembers()">บันทึกข้อมูล</button>
            </div>
        </div>
    </div>
</div>

<!-- ========================================== -->
<!-- MODAL: ย้ายโต๊ะ -->
<!-- ========================================== -->
<div class="modal fade" id="moveTableModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content" style="border-radius: 15px;">
            <div class="modal-header bg-secondary text-white">
                <h5 class="modal-title fw-bold">🔄 ย้ายโต๊ะ</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>ย้ายจาก **โต๊ะ <span id="moveFromTable"></span>** ไปยัง:</p>
                <div class="mb-3">
                    <label class="form-label fw-bold">เลือกโต๊ะปลายทาง (โต๊ะว่าง):</label>
                    <select id="targetTableSelect" class="form-select form-select-lg"></select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
                <button type="button" class="btn btn-primary fw-bold" onclick="confirmMoveTable()">ยืนยันการย้าย</button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // ตั้งค่า Firebase (ปรับเปลี่ยนค่าคอนฟิกตามโปรเจกต์จริงของคุณ)
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };
    
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let selectedTableNo = null;
    let tablesData = {};

    // โหลดข้อมูลโต๊ะ Real-time
    function fetchTables() {
        db.collection("tables").onSnapshot(snapshot => {
            const container = document.getElementById('tableGridContainer');
            container.innerHTML = '';
            tablesData = {};

            snapshot.forEach(doc => {
                const data = doc.data();
                const tableNo = doc.id;
                tablesData[tableNo] = data;

                const isOccupied = data.status === 'ไม่ว่าง';
                const cardClass = isOccupied ? 'occupied-table' : 'vacant-table';
                const textClass = isOccupied ? 'text-danger' : 'text-success';

                container.innerHTML += `
                    <div class="col">
                        <div class="card text-center h-100 shadow-sm table-card ${cardClass}" onclick="selectTable('${tableNo}')">
                            <div class="card-body p-2 d-flex flex-column justify-content-center align-items-center">
                                <div class="${textClass} fw-bold fs-5 mb-1">โต๊ะ ${tableNo}</div>
                                ${isOccupied ? 
                                    <div class="${textClass} fw-bold fs-5">👥 ${data.totalPeople || 0}</div><div class="${textClass} fw-bold fs-6">คน</div> : 
                                    <div class="text-secondary fs-6">ว่าง</div>
                                }
                            </div>
                        </div>
                    </div>
                `;
            });
        }, error => {
            console.log("ใช้โหมดจำลองเนื่องจากไม่ได้ต่อ Firebase Config จริง");
        });
    }

    window.onload = fetchTables;

    // เลือกโต๊ะ
    function selectTable(tNo) {
        selectedTableNo = tNo;
        document.getElementById('selectedTableBadge').innerText = tNo;
        
        const actionSection = document.getElementById('tableActionSection');
        actionSection.style.display = 'block';
        actionSection.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    // เข้าหน้าสั่งอาหาร/รายละเอียดโต๊ะ
    function goToTableDetail() {
        if (!selectedTableNo) return alert("กรุณาเลือกโต๊ะก่อนครับ");
        window.location.href = `table.html?table=${selectedTableNo}`;
    }

    // ยกเลิกโต๊ะ
    async function cancelTable() {
        if (!selectedTableNo) return alert("กรุณาเลือกโต๊ะก่อน");
        
        if (confirm(`ยืนยันการยกเลิกโต๊ะ ${selectedTableNo} ใช่หรือไม่? ข้อมูลจะถูกล้าง`)) {
            try {
                await db.collection("tables").doc(String(selectedTableNo)).set({
                    status: "ว่าง",
                    totalPeople: 0,
                    adults: 0,
                    children: 0,
                    orders: []
                });
                alert("ยกเลิกโต๊ะสำเร็จ");
                document.getElementById('tableActionSection').style.display = 'none';
            } catch (err) {
                alert("ล้างข้อมูลโต๊ะเรียบร้อย (Mock Mode)");
                document.getElementById('tableActionSection').style.display = 'none';
            }
        }
    }

    // เปิด Modal จัดการสมาชิก
    function openMemberModal() {
        if (!selectedTableNo) return alert("กรุณาเลือกโต๊ะก่อน");
        document.getElementById('modalTableNo').innerText = selectedTableNo;
        new bootstrap.Modal(document.getElementById('memberModal')).show();
    }

    // บันทึกจำนวนสมาชิก
    async function saveTableMembers() {
        const adults = parseInt(document.getElementById('adultCount').value) || 0;
        const children = parseInt(document.getElementById('childCount').value) || 0;
        const total = adults + children;

        try {
            await db.collection("tables").doc(String(selectedTableNo)).set({
                status: total > 0 ? "ไม่ว่าง" : "ว่าง",
                adults: adults,
                children: children,
                totalPeople: total
            }, { merge: true });
            
            bootstrap.Modal.getInstance(document.getElementById('memberModal')).hide();
            alert("บันทึกจำนวนลูกค้าเรียบร้อยแล้ว");
        } catch (err) {
            alert("บันทึกสำเร็จ (Mock Mode)");
            bootstrap.Modal.getInstance(document.getElementById('memberModal')).hide();
        }
    }

    // เปิด Modal ย้ายโต๊ะ
    function openMoveTableModal() {
        if (!selectedTableNo) return alert("กรุณาเลือกโต๊ะก่อน");
        
        document.getElementById('moveFromTable').innerText = selectedTableNo;
        const select = document.getElementById('targetTableSelect');
        select.innerHTML = '';

        Object.keys(tablesData).forEach(tNo => {
            if (tNo !== String(selectedTableNo) && tablesData[tNo].status !== 'ไม่ว่าง') {
                select.innerHTML += `<option value="${tNo}">โต๊ะ ${tNo}</option>`;
            }
        });

        if (select.children.length === 0) {
            select.innerHTML = '<option value="">ไม่มีโต๊ะว่าง</option>';
        }

        new bootstrap.Modal(document.getElementById('moveTableModal')).show();
    }

    // ยืนยันการย้ายโต๊ะ
    async function confirmMoveTable() {
        const targetTable = document.getElementById('targetTableSelect').value;
        if (!targetTable) return alert("กรุณาเลือกโต๊ะปลายทาง");

        try {
            const currentData = tablesData[selectedTableNo] || {};
            await db.collection("tables").doc(targetTable).set({ ...currentData, status: "ไม่ว่าง" });
            await db.collection("tables").doc(String(selectedTableNo)).set({
                status: "ว่าง", totalPeople: 0, adults: 0, children: 0, orders: []
            });

            bootstrap.Modal.getInstance(document.getElementById('moveTableModal')).hide();
            alert(`ย้ายข้อมูลไปยังโต๊ะ ${targetTable} สำเร็จ`);
            selectTable(targetTable);
        } catch (err) {
            alert("ย้ายโต๊ะสำเร็จ (Mock Mode)");
            bootstrap.Modal.getInstance(document.getElementById('moveTableModal')).hide();
        }
    }

    // ปุ่มฟังก์ชันกะการทำงาน
    function closeShift() { alert("เปิดหน้าต่างปิดกะ"); }
    function manageCash() { alert("เปิดหน้าต่างเงินเข้า-ออก"); }
    function viewHistory() { alert("เปิดดูประวัติบิลย้อนหลัง"); }
    function addTable() { alert("เพิ่มโต๊ะใหม่"); }
    function removeTable() { alert("ลดจำนวนโต๊ะ"); }
</script>

</body>
</html>
